<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcroVault — The Master Cyber Tool Directory</title>
    <meta name="description" content="Premium cybersecurity intelligence platform. OSINT, forensics, exploit, malware analysis tools.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-color: #0d0e15; --surface: #15161f; --surface-hover: #1e202d;
            --border: #262836; --border-active: #00f0ff;
            --text-main: #f0f0f5; --text-muted: #8b8d98;
            --cyan: #00f0ff; --purple: #b05bff;
            
            --radius-pill: 100px; --radius-card: 16px;
            --font-main: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font-main); background-color: var(--bg-color);
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px; background-position: center center;
            color: var(--text-main); min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased;
        }

        /* Nav */
        .nav-wrapper { position: fixed; top: 24px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; padding: 0 16px; }
        nav { display: flex; align-items: center; justify-content: space-between; background: rgba(21, 22, 31, 0.7); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 10px 24px; width: 100%; max-width: 1100px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); }
        .nav-brand-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: linear-gradient(135deg, var(--cyan), var(--purple)); border-radius: 10px; color: #fff; }
        .nav-brand-icon svg { width: 18px; height: 18px; fill: currentColor; }
        .nav-brand-text { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
        
        .nav-links { display: flex; align-items: center; gap: 28px; }
        .nav-links a, .nav-links span { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-main); }
        
        .btn-premium { background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 240, 255, 0.3); padding: 8px 20px; border-radius: var(--radius-pill); color: var(--cyan) !important; text-decoration: none; font-size: 0.9rem; font-weight: 600; box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-premium::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, transparent, transparent, var(--cyan)); animation: rotate 4s linear infinite; opacity: 0.3; z-index: -1; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .btn-premium:hover { background: rgba(0, 240, 255, 0.1); border-color: var(--cyan); box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); transform: translateY(-1px); }
        .btn-premium:active { transform: scale(0.95); }
        
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-main); cursor: pointer; padding: 4px; }

        @media (max-width: 768px) {
            .nav-wrapper { top: 12px; padding: 0 12px; }
            nav { flex-wrap: wrap; border-radius: 20px; padding: 12px 20px; }
            .nav-links { display: none; flex-direction: column; width: 100%; gap: 16px; padding-top: 20px; padding-bottom: 10px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 16px; }
            .nav-links.show { display: flex; }
            .mobile-menu-btn { display: block; }
            .btn-premium { text-align: center; }
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .hero { padding: 180px 0 72px; text-align: center; }
        .hero h1 { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.04em; margin-bottom: 24px; text-shadow: 0 0 60px rgba(0, 240, 255, 0.15); }
        .gradient-text { background: linear-gradient(to right, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 40px rgba(0, 240, 255, 0.4); }
        .hero p { color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 48px; }

        .search-container { position: relative; max-width: 640px; margin: 0 auto 56px; }
        .search-input { width: 100%; padding: 20px 24px 20px 52px; background: rgba(21, 22, 31, 0.6); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: var(--radius-pill); color: var(--text-main); font-family: var(--font-main); font-size: 1.05rem; outline: none; transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .search-input:focus { border-color: rgba(0, 240, 255, 0.5); box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.1), 0 12px 40px rgba(0,0,0,0.5); background: rgba(21, 22, 31, 0.9); }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 20px; height: 20px; pointer-events: none; }

        .filters { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 72px; }
        .filter-btn { display: flex; align-items: center; gap: 8px; background: rgba(21, 22, 31, 0.5); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 18px; border-radius: var(--radius-pill); font-family: var(--font-main); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(4px); }
        .filter-btn svg { width: 14px; height: 14px; }
        .filter-btn:hover { background: var(--surface); color: var(--text-main); border-color: rgba(255,255,255,0.1); }
        .filter-btn.active { background: rgba(0, 240, 255, 0.08); border-color: var(--border-active); color: var(--cyan); box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); }

        .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-bottom: 100px; }
        .tool-card { background: rgba(21, 22, 31, 0.4); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 24px; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); height: 240px; position: relative; overflow: hidden; }
        .tool-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--cyan), var(--purple)); opacity: 0; transition: opacity 0.3s; }
        .tool-card:hover { border-color: rgba(0, 240, 255, 0.4); background: rgba(21, 22, 31, 0.8); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.1); }
        .tool-card:hover::before { opacity: 1; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .card-icon { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid var(--border); color: var(--text-main); transition: all 0.3s; }
        .tool-card:hover .card-icon { color: var(--cyan); border-color: rgba(0, 240, 255, 0.3); background: rgba(0, 240, 255, 0.05); }
        .card-cat { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; background: rgba(0,0,0,0.3); padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-pill); }
        .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); letter-spacing: -0.01em; }
        .card-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; flex-grow: 1; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px; margin-top: auto; }
        .card-domain { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .card-domain svg { width: 12px; height: 12px; opacity: 0.5; }
        .card-arrow { width: 16px; height: 16px; color: var(--cyan); opacity: 0; transform: translateX(-4px); transition: all 0.3s; }
        .tool-card:hover .card-arrow { opacity: 1; transform: translateX(0); }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 100px 20px; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-card); background: rgba(21, 22, 31, 0.4); backdrop-filter: blur(8px); }

        footer { border-top: 1px solid var(--border); padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 16px; background: rgba(13, 14, 21, 0.9); }
        .footer-links { display: flex; justify-content: center; gap: 32px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; font-weight: 500; }
        .footer-links a:hover { color: var(--text-main); }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .tool-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="nav-wrapper">
        <nav>
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
                <span class="nav-brand-text">AcroVault</span>
            </a>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i data-lucide="menu"></i>
            </button>
            <div class="nav-links" id="navLinks">
                <span><span id="nav-count">0</span> Tools</span>
                <a href="about.html">About</a>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
                <a href="premium.html" class="btn-premium">Premium</a>
            </div>
        </nav>
    </div>

    <div class="container">
        <section class="hero">
            <h1>The <span class="gradient-text">No-Bullsh*t</span> Master<br>Web Tool Directory</h1>
            <p>1,251+ native client-side tools & curated open-source apps. All in one instant, searchable portal.</p>
            
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by tool name, tag, or category...">
            </div>
        </section>

        <section id="tools">
            <div class="filters" id="filterContainer"></div>
            <div class="tool-grid" id="toolGrid"></div>
        </section>
    </div>

    <footer>
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="premium.html">Premium</a>
            <a href="about.html">About</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </div>
        <p>© 2026 AcroVault. Built for security professionals.</p>
    </footer>

    <script src="tools-data.js"></script>
    <script>
        const CAT_ICONS = {
            'crime-evidence': 'scale', 'osint': 'radar', 'roadmap': 'map',
            'hardware-hacking': 'cpu', 'ai-research': 'brain', 'vapt': 'shield-alert',
            'ai-hacking': 'bot', 'account-tools': 'user-plus', 'ai-attack': 'swords',
            'malware-analysis': 'bug', 'url-scanning': 'link-2', 'social-engineering': 'fish',
            'exploit-directory': 'bomb', 'malware-courses': 'graduation-cap',
            'digital-forensics': 'scan-search', 'port-scanners': 'network',
            'detection-tools': 'car', 'api-gateway': 'server', 'ethical-hacking': 'book-open',
            'breach-lookup': 'alert-triangle'
        };

        const tools = window.ACROVAULT_TOOLS || [];
        const categories = window.ACROVAULT_CATEGORIES || [];
        let activeCategory = 'all';
        let searchQuery = '';

        document.getElementById('nav-count').textContent = tools.length + '+';
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('show');
        });

        const filterContainer = document.getElementById('filterContainer');
        function renderFilters() {
            filterContainer.innerHTML = `
                <button class="filter-btn ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">
                    All Tools (${tools.length}+)
                </button>
                ${categories.slice(0, 10).map(c => `
                    <button class="filter-btn ${activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">
                        <i data-lucide="${CAT_ICONS[c.id] || 'box'}"></i> ${c.name}
                    </button>
                `).join('')}
            `;
            lucide.createIcons();
        }

        function renderTools() {
            const grid = document.getElementById('toolGrid');
            const q = searchQuery.toLowerCase();
            
            const filtered = tools.filter(t => {
                const matchCat = activeCategory === 'all' || t.category === activeCategory;
                const tName = t.name ? t.name.toLowerCase() : '';
                const tDesc = t.desc ? t.desc.toLowerCase() : '';
                const tTagsMatch = t.tags ? t.tags.some(tag => (tag || '').toLowerCase().includes(q)) : false;
                const matchSearch = !q || tName.includes(q) || tDesc.includes(q) || tTagsMatch;
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">
                    <i data-lucide="search-x" style="width:48px;height:48px;margin-bottom:16px;opacity:0.5;"></i>
                    <p>No tools found matching your criteria.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.slice(0, 60).map(t => {
                const icon = CAT_ICONS[t.category] || 'box';
                let domain = '';
                try { domain = new URL(t.url).hostname.replace('www.',''); } catch(e) { domain = 'link'; }
                
                return `
                <a href="tool.html?id=${t.id}" class="tool-card">
                    <div class="card-top">
                        <div class="card-icon"><i data-lucide="${icon}"></i></div>
                        <span class="card-cat">${t.categoryName.substring(0, 18)}</span>
                    </div>
                    <h3 class="card-title">${t.name || 'Unnamed Tool'}</h3>
                    <p class="card-desc">${t.desc || 'No description provided.'}</p>
                    <div class="card-footer">
                        <span class="card-domain"><i data-lucide="link"></i> ${domain}</span>
                        <i data-lucide="arrow-right" class="card-arrow"></i>
                    </div>
                </a>`;
            }).join('');
            
            lucide.createIcons();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderTools();
        });

        filterContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (btn) {
                activeCategory = btn.dataset.cat;
                renderFilters();
                renderTools();
            }
        });

        renderFilters();
        renderTools();
    </script>
</body>
</html>
