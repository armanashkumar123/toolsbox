<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcroVault — The Master Cyber Tool Directory</title>
    <meta name="description" content="Premium cybersecurity intelligence platform. OSINT, forensics, exploit, malware analysis tools.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-color: #0b0c10;
            --surface: #14151a;
            --surface-hover: #1c1d24;
            --border: #22242b;
            --border-active: #00e5ff;
            --text-main: #f0f0f5;
            --text-muted: #8b8d98;
            --cyan: #00e5ff;
            --purple: #9d4edd;
            
            --radius-pill: 100px;
            --radius-card: 12px;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: center center;
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Floating Pill Nav */
        .nav-wrapper {
            position: fixed;
            top: 24px; left: 0; right: 0;
            display: flex; justify-content: center;
            z-index: 100;
            padding: 0 16px;
        }
        nav {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(20, 21, 26, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 12px 24px;
            width: 100%; max-width: 1100px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-main);
        }
        .nav-brand-icon {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border-radius: 8px;
            color: #fff;
        }
        .nav-brand-icon svg { width: 16px; height: 16px; }
        .nav-brand-text { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em; }
        
        .nav-links { display: flex; align-items: center; gap: 24px; }
        .nav-links a {
            color: var(--text-muted); text-decoration: none; font-size: 0.9rem;
            font-weight: 500; transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--text-main); }
        .btn-github {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 6px 16px; border-radius: var(--radius-pill); color: var(--text-main);
            text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s;
        }
        .btn-github:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-main); cursor: pointer; }

        /* Container */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        /* Hero */
        .hero { padding: 160px 0 64px; text-align: center; }
        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800; line-height: 1.1; letter-spacing: -0.03em;
            margin-bottom: 24px; text-shadow: 0 0 40px rgba(0, 229, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(to right, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }
        .hero p {
            color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 40px;
        }

        /* Search */
        .search-container {
            position: relative; max-width: 600px; margin: 0 auto 48px;
        }
        .search-input {
            width: 100%; padding: 18px 24px 18px 48px;
            background: rgba(20, 21, 26, 0.8); backdrop-filter: blur(8px);
            border: 1px solid var(--border); border-radius: var(--radius-pill);
            color: var(--text-main); font-family: var(--font-main); font-size: 1rem;
            outline: none; transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }
        .search-input:focus {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.1), 0 4px 24px rgba(0,0,0,0.4);
            background: rgba(20, 21, 26, 0.95);
        }
        .search-icon {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); width: 18px; height: 18px; pointer-events: none;
        }

        /* Filters */
        .filters {
            display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 64px;
        }
        .filter-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text-muted); padding: 8px 16px; border-radius: var(--radius-pill);
            font-family: var(--font-main); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease;
        }
        .filter-btn svg { width: 14px; height: 14px; }
        .filter-btn:hover { background: var(--surface-hover); color: var(--text-main); }
        .filter-btn.active {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--border-active);
            color: var(--cyan);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.1);
        }

        /* Grid */
        .tool-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 80px;
        }
        
        .tool-card {
            background: rgba(20, 21, 26, 0.6); backdrop-filter: blur(4px);
            border: 1px solid var(--border); border-radius: var(--radius-card);
            padding: 24px; display: flex; flex-direction: column;
            text-decoration: none; color: inherit; transition: all 0.3s ease;
        }
        .tool-card:hover {
            border-color: rgba(0, 229, 255, 0.3);
            background: rgba(20, 21, 26, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .card-icon {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; background: var(--surface-hover);
            border-radius: 8px; border: 1px solid var(--border); color: var(--text-main);
            transition: all 0.3s;
        }
        .tool-card:hover .card-icon { color: var(--cyan); border-color: rgba(0, 229, 255, 0.3); }
        .card-cat {
            font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted);
            text-transform: uppercase; background: var(--surface); padding: 4px 8px;
            border: 1px solid var(--border); border-radius: 4px;
        }
        
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .card-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; flex-grow: 1; margin-bottom: 20px; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px; }
        .card-domain { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
        .card-arrow { width: 16px; height: 16px; color: var(--cyan); opacity: 0; transform: translateX(-4px); transition: all 0.3s; }
        .tool-card:hover .card-arrow { opacity: 1; transform: translateX(0); }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); }

        /* Footer */
        footer {
            border-top: 1px solid var(--border); padding: 40px 24px;
            text-align: center; color: var(--text-muted); font-size: 0.85rem;
            display: flex; flex-direction: column; gap: 16px;
            background: rgba(11, 12, 16, 0.8);
        }
        .footer-links { display: flex; justify-content: center; gap: 24px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--text-main); }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .hero h1 { font-size: 2.2rem; }
            .nav-wrapper { top: 12px; padding: 0 12px; }
        }
    </style>
</head>
<body>
    <div class="nav-wrapper">
        <nav>
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon"><i data-lucide="zap"></i></div>
                <span class="nav-brand-text">AcroVault</span>
            </a>
            <div class="nav-links">
                <span style="color: var(--text-muted); font-size: 0.85rem;"><span id="nav-count">0</span> Tools</span>
                <a href="premium.html">Premium API</a>
                <a href="about.html">About</a>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html" class="btn-github"><i data-lucide="shield"></i> Terms</a>
            </div>
            <button class="mobile-menu-btn">
                <i data-lucide="menu"></i>
            </button>
        </nav>
    </div>

    <div class="container">
        <section class="hero">
            <h1>The <span class="gradient-text">No-Bullsh*t</span> Master<br>Cyber Tool Directory</h1>
            <p>Curated OSINT, digital forensics, and premium threat intelligence tools. All in one instant, searchable portal.</p>
            
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by tool name, tag, or category...">
            </div>
        </section>

        <section id="tools">
            <div class="filters" id="filterContainer"></div>
            <div class="tool-grid" id="toolGrid"></div>
        </section>
    </div>

    <footer>
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="premium.html">Premium</a>
            <a href="about.html">About</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </div>
        <p>© 2026 AcroVault. Built for security professionals.</p>
    </footer>

    <script src="tools-data.js"></script>
    <script>
        const CAT_ICONS = {
            'crime-evidence': 'scale', 'osint': 'radar', 'roadmap': 'map',
            'hardware-hacking': 'cpu', 'ai-research': 'brain', 'vapt': 'shield-alert',
            'ai-hacking': 'bot', 'account-tools': 'user-plus', 'ai-attack': 'swords',
            'malware-analysis': 'bug', 'url-scanning': 'link-2', 'social-engineering': 'fish',
            'exploit-directory': 'bomb', 'malware-courses': 'graduation-cap',
            'digital-forensics': 'scan-search', 'port-scanners': 'network',
            'detection-tools': 'car', 'api-gateway': 'server', 'ethical-hacking': 'book-open',
            'breach-lookup': 'alert-triangle'
        };

        const tools = window.ACROVAULT_TOOLS || [];
        const categories = window.ACROVAULT_CATEGORIES || [];
        let activeCategory = 'all';
        let searchQuery = '';

        document.getElementById('nav-count').textContent = tools.length + '+';

        // Initialize Filters
        const filterContainer = document.getElementById('filterContainer');
        
        function renderFilters() {
            filterContainer.innerHTML = `
                <button class="filter-btn ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">
                    All Tools (${tools.length}+)
                </button>
                ${categories.slice(0, 10).map(c => `
                    <button class="filter-btn ${activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">
                        <i data-lucide="${CAT_ICONS[c.id] || 'box'}"></i> ${c.name}
                    </button>
                `).join('')}
            `;
            lucide.createIcons();
        }

        // Render Grid
        function renderTools() {
            const grid = document.getElementById('toolGrid');
            const q = searchQuery.toLowerCase();
            
            const filtered = tools.filter(t => {
                const matchCat = activeCategory === 'all' || t.category === activeCategory;
                
                // Defensive programming to prevent search crashes
                const tName = t.name ? t.name.toLowerCase() : '';
                const tDesc = t.desc ? t.desc.toLowerCase() : '';
                const tTagsMatch = t.tags ? t.tags.some(tag => (tag || '').toLowerCase().includes(q)) : false;
                
                const matchSearch = !q || tName.includes(q) || tDesc.includes(q) || tTagsMatch;
                
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">
                    <i data-lucide="search-x" style="width:48px;height:48px;margin-bottom:16px;opacity:0.5;"></i>
                    <p>No tools found matching your criteria.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.slice(0, 60).map(t => {
                const icon = CAT_ICONS[t.category] || 'box';
                let domain = '';
                try { domain = new URL(t.url).hostname.replace('www.',''); } catch(e) { domain = 'link'; }
                
                return `
                <a href="tool.html?id=${t.id}" class="tool-card">
                    <div class="card-top">
                        <div class="card-icon"><i data-lucide="${icon}"></i></div>
                        <span class="card-cat">${t.categoryName.substring(0, 18)}</span>
                    </div>
                    <h3 class="card-title">${t.name || 'Unnamed Tool'}</h3>
                    <p class="card-desc">${t.desc || 'No description provided.'}</p>
                    <div class="card-footer">
                        <span class="card-domain">${domain}</span>
                        <i data-lucide="arrow-right" class="card-arrow"></i>
                    </div>
                </a>`;
            }).join('');
            
            lucide.createIcons();
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderTools();
        });

        filterContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (btn) {
                activeCategory = btn.dataset.cat;
                renderFilters();
                renderTools();
            }
        });

        // Init
        renderFilters();
        renderTools();
    </script>
</body>
</html>
