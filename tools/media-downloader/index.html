<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 & MP4 Downloader - Free No Signup | ToolsHub</title>
    <meta name="description" content="Free online YouTube and Media downloader. Download MP3 and MP4 from YouTube, Twitter, TikTok, and more in high quality without signup.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg: #0A0A0F;
            --card-bg: rgba(17, 17, 24, 0.7);
            --card-border: rgba(0, 240, 255, 0.15);
            --primary: #6C63FF; /* Fallback primary */
            --accent: #00F0FF; /* Cyan glow */
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --danger: #ff4b4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(108, 99, 255, 0.04) 0%, transparent 50%);
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: color 0.2s;
            margin-right: 2rem;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .brand {
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(90deg, var(--text), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            box-shadow: 0 8px 32px rgba(0, 240, 255, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
        }

        .url-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(108, 99, 255, 0.2));
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--accent);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(108, 99, 255, 0.3));
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .btn-sample {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 0;
            margin-top: 0.5rem;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .btn-sample:hover {
            color: var(--accent);
            background: transparent;
            transform: none;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            display: none; /* Hidden until URL is valid */
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, .toggle-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        
        select:focus {
            border-color: var(--accent);
        }

        option {
            background: var(--bg);
            color: var(--text);
        }

        /* Custom Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: var(--text-muted);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(0, 240, 255, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.5);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: var(--accent);
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 0;
        }

        /* Preview Box */
        .preview-box {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 2rem;
            gap: 1.5rem;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .preview-box.active {
            display: flex;
        }

        .thumbnail-container {
            width: 200px;
            height: 112px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #000;
            flex-shrink: 0;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .video-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .platform-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            width: fit-content;
            color: var(--accent);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        /* Action Area */
        .action-area {
            display: none;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .action-area.active {
            display: flex;
        }

        .download-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #6C63FF, #00F0FF);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4);
            filter: brightness(1.1);
        }

        .api-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        .api-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .api-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* Loading animation */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 240, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            .preview-box {
                flex-direction: column;
            }
            .thumbnail-container {
                width: 100%;
                height: 180px;
            }
            .api-links {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </a>
        <div class="brand">ToolsHub</div>
    </header>

    <main>
        <div class="container">
            <h1>Media Downloader</h1>
            <p class="subtitle">Extract MP3 & MP4 from YouTube, Twitter, TikTok, and more</p>

            <div class="glass-card">
                <div class="input-group">
                    <input type="text" id="urlInput" class="url-input" placeholder="Paste video or audio URL here..." autocomplete="off">
                    <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
                </div>
                <div id="errorMsg" class="error-msg">Invalid URL or unsupported platform.</div>
                
                <div style="text-align: left;">
                    <button type="button" id="sampleBtn" class="btn btn-sample">Load sample YouTube link</button>
                </div>

                <div id="loader" class="loader" style="margin-top: 2rem;"></div>

                <!-- Preview Area -->
                <div id="previewBox" class="preview-box" style="margin-top: 2rem;">
                    <div class="thumbnail-container">
                        <img id="thumbImg" class="thumbnail" src="" alt="Thumbnail">
                        <div id="durationBadge" class="duration">0:00</div>
                    </div>
                    <div class="video-info">
                        <div id="videoTitle" class="video-title">Video Title Placeholder</div>
                        <div class="video-meta">
                            <span id="videoAuthor">Channel Name</span>
                            <span id="platformBadge" class="platform-badge">YouTube</span>
                        </div>
                    </div>
                </div>

                <!-- Options -->
                <div id="optionsGrid" class="options-grid">
                    <div class="form-group">
                        <label>Format</label>
                        <select id="formatSelect">
                            <option value="mp4">Video (MP4)</option>
                            <option value="mp3">Audio (MP3)</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="qualityGroup">
                        <label>Quality</label>
                        <select id="qualitySelect">
                            <option value="1080">1080p HD</option>
                            <option value="720" selected>720p HD</option>
                            <option value="480">480p SD</option>
                            <option value="360">360p SD</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Audio Only</label>
                        <div class="toggle-wrapper">
                            <label class="toggle-switch">
                                <input type="checkbox" id="audioToggle">
                                <span class="slider"></span>
                            </label>
                            <span style="font-size: 0.9rem; color: var(--text-muted);">Extract audio</span>
                        </div>
                    </div>
                </div>

                <!-- Action Area -->
                <div id="actionArea" class="action-area">
                    <button id="downloadBtn" class="download-btn">Generate Download Link</button>
                    
                    <div class="api-links">
                        <a href="#" id="cobaltLink" class="api-btn" target="_blank" rel="noopener">Open via Cobalt API</a>
                        <a href="#" id="invidiousLink" class="api-btn" target="_blank" rel="noopener">Open via Invidious</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlInput = document.getElementById('urlInput');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const sampleBtn = document.getElementById('sampleBtn');
            const errorMsg = document.getElementById('errorMsg');
            const loader = document.getElementById('loader');
            const previewBox = document.getElementById('previewBox');
            const optionsGrid = document.getElementById('optionsGrid');
            const actionArea = document.getElementById('actionArea');
            
            // Preview elements
            const thumbImg = document.getElementById('thumbImg');
            const videoTitle = document.getElementById('videoTitle');
            const videoAuthor = document.getElementById('videoAuthor');
            const durationBadge = document.getElementById('durationBadge');
            const platformBadge = document.getElementById('platformBadge');
            
            // Options elements
            const formatSelect = document.getElementById('formatSelect');
            const qualitySelect = document.getElementById('qualitySelect');
            const qualityGroup = document.getElementById('qualityGroup');
            const audioToggle = document.getElementById('audioToggle');
            
            // Action elements
            const downloadBtn = document.getElementById('downloadBtn');
            const cobaltLink = document.getElementById('cobaltLink');
            const invidiousLink = document.getElementById('invidiousLink');

            // Video data state
            let currentMedia = null;

            sampleBtn.addEventListener('click', () => {
                urlInput.value = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
                analyzeBtn.click();
            });

            // Format / Audio toggle logic
            audioToggle.addEventListener('change', (e) => {
                if(e.target.checked) {
                    formatSelect.value = 'mp3';
                    updateQualityOptions('mp3');
                } else {
                    formatSelect.value = 'mp4';
                    updateQualityOptions('mp4');
                }
            });

            formatSelect.addEventListener('change', (e) => {
                const isAudio = e.target.value === 'mp3';
                audioToggle.checked = isAudio;
                updateQualityOptions(e.target.value);
            });

            function updateQualityOptions(format) {
                qualitySelect.innerHTML = '';
                if(format === 'mp3') {
                    qualitySelect.innerHTML = `
                        <option value="320">320 kbps (High)</option>
                        <option value="256">256 kbps (Medium)</option>
                        <option value="128">128 kbps (Low)</option>
                    `;
                } else {
                    qualitySelect.innerHTML = `
                        <option value="1080">1080p HD</option>
                        <option value="720" selected>720p HD</option>
                        <option value="480">480p SD</option>
                        <option value="360">360p SD</option>
                    `;
                }
            }

            // Platform parsers
            function parseURL(url) {
                const result = { valid: false, platform: 'Unknown', id: null };
                
                try {
                    const parsedUrl = new URL(url);
                    const hostname = parsedUrl.hostname.toLowerCase();
                    
                    // YouTube
                    if (hostname.includes('youtube.com') || hostname.includes('youtu.be')) {
                        result.platform = 'YouTube';
                        result.valid = true;
                        if (hostname.includes('youtu.be')) {
                            result.id = parsedUrl.pathname.slice(1);
                        } else {
                            result.id = parsedUrl.searchParams.get('v');
                        }
                    }
                    // Twitter
                    else if (hostname.includes('twitter.com') || hostname.includes('x.com')) {
                        result.platform = 'Twitter/X';
                        const match = parsedUrl.pathname.match(/status\/(\d+)/);
                        if (match) {
                            result.valid = true;
                            result.id = match[1];
                        }
                    }
                    // TikTok
                    else if (hostname.includes('tiktok.com')) {
                        result.platform = 'TikTok';
                        result.valid = true; // TikTok IDs can be complex, just mark valid
                        const match = parsedUrl.pathname.match(/video\/(\d+)/);
                        if(match) result.id = match[1];
                    }
                    // Instagram
                    else if (hostname.includes('instagram.com')) {
                        result.platform = 'Instagram';
                        if(parsedUrl.pathname.includes('/p/') || parsedUrl.pathname.includes('/reel/')) {
                            result.valid = true;
                        }
                    }
                    // Vimeo
                    else if (hostname.includes('vimeo.com')) {
                        result.platform = 'Vimeo';
                        const match = parsedUrl.pathname.match(/vimeo\.com\/(\d+)/);
                        if(match) {
                            result.valid = true;
                            result.id = match[1];
                        }
                    }
                } catch (e) {
                    // Invalid URL format
                }
                
                return result;
            }

            analyzeBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                errorMsg.style.display = 'none';
                
                if (!url) {
                    showError('Please enter a valid URL.');
                    return;
                }

                const parsed = parseURL(url);
                if (!parsed.valid) {
                    showError('Unsupported platform or invalid URL format. Please try YouTube, Twitter, TikTok, or Instagram.');
                    return;
                }

                currentMedia = { url, ...parsed };
                
                // Reset UI
                previewBox.classList.remove('active');
                optionsGrid.style.display = 'none';
                actionArea.classList.remove('active');
                
                // Show loader
                loader.style.display = 'block';

                // Simulate API fetch delay
                setTimeout(() => {
                    loader.style.display = 'none';
                    showPreview(currentMedia);
                }, 800);
            });

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                previewBox.classList.remove('active');
                optionsGrid.style.display = 'none';
                actionArea.classList.remove('active');
            }

            function showPreview(media) {
                // Mock metadata based on platform
                videoTitle.textContent = `Extracted Media from ${media.platform}`;
                videoAuthor.textContent = `Unknown Creator`;
                durationBadge.textContent = '3:30';
                platformBadge.textContent = media.platform;
                
                if (media.platform === 'YouTube' && media.id) {
                    thumbImg.src = `https://img.youtube.com/vi/${media.id}/maxresdefault.jpg`;
                    videoTitle.textContent = `YouTube Video ID: ${media.id}`;
                    videoAuthor.textContent = 'YouTube Channel';
                } else if (media.platform === 'Twitter/X') {
                    thumbImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100"><rect width="100%" height="100%" fill="%231DA1F2"/><text x="50" y="55" font-family="sans-serif" font-size="20" fill="white" text-anchor="middle">Twitter Video</text></svg>';
                } else if (media.platform === 'TikTok') {
                    thumbImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100"><rect width="100%" height="100%" fill="%23000"/><text x="50" y="55" font-family="sans-serif" font-size="20" fill="white" text-anchor="middle">TikTok Video</text></svg>';
                } else {
                    thumbImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100"><rect width="100%" height="100%" fill="%23333"/><text x="50" y="55" font-family="sans-serif" font-size="16" fill="white" text-anchor="middle">Preview Not Available</text></svg>';
                }

                // Show panels
                previewBox.classList.add('active');
                optionsGrid.style.display = 'grid';
                actionArea.classList.add('active');

                updateActionLinks();
            }

            function updateActionLinks() {
                if(!currentMedia) return;
                const encodedUrl = encodeURIComponent(currentMedia.url);
                
                // Cobalt UI Link (using public instance web UI for demonstration)
                cobaltLink.href = `https://cobalt.tools/`; 
                
                // Invidious API Link (mock)
                if(currentMedia.platform === 'YouTube' && currentMedia.id) {
                    invidiousLink.href = `https://yewtu.be/watch?v=${currentMedia.id}`;
                    invidiousLink.style.display = 'block';
                } else {
                    invidiousLink.style.display = 'none';
                }
            }

            downloadBtn.addEventListener('click', () => {
                const format = formatSelect.value;
                const quality = qualitySelect.value;
                const btnText = downloadBtn.textContent;
                
                downloadBtn.textContent = 'Processing...';
                downloadBtn.style.opacity = '0.7';
                downloadBtn.disabled = true;

                // Simulate processing time
                setTimeout(() => {
                    downloadBtn.textContent = 'Ready! Redirecting...';
                    downloadBtn.style.background = 'linear-gradient(90deg, #00F0FF, #00D4AA)';
                    
                    setTimeout(() => {
                        alert(`In a real app, this would download the ${format.toUpperCase()} file at ${quality}${format==='mp4'?'p':'kbps'}.\nURL: ${currentMedia.url}`);
                        
                        // Reset button
                        downloadBtn.textContent = btnText;
                        downloadBtn.style.opacity = '1';
                        downloadBtn.style.background = '';
                        downloadBtn.disabled = false;
                    }, 1000);
                }, 1500);
            });
            
            // Allow Enter key to trigger analysis
            urlInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    analyzeBtn.click();
                }
            });
        });
    </script>
</body>
</html>
