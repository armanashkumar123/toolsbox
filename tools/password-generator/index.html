<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Create Strong Secure Passwords | ToolsHub</title>
    <meta name="description" content="Generate strong, secure, and customizable passwords instantly. Features length control, character options, bulk generation, and strength testing.">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Password Generator",
      "url": "https://toolshub.example.com/tools/password-generator",
      "description": "Generate strong, secure, and customizable passwords instantly.",
      "applicationCategory": "Utility",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0a0a1a;
            --card-bg: rgba(18, 18, 42, 0.8);
            --card-border: rgba(108, 99, 255, 0.2);
            --primary: #6C63FF;
            --primary-hover: #5a52d6;
            --accent: #00D4AA;
            --text-main: #ffffff;
            --text-muted: #a0a0c0;
            --danger: #ff4757;
            --warning: #ffa502;
            --caution: #ffdd57;
            --success: #00D4AA;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 1.5rem 2rem;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        .back-link {
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--primary);
        }

        /* Main Container */
        main {
            flex: 1;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .page-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Card Style */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        /* Output Section */
        .output-section {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .password-display-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s ease;
            max-height: 250px;
            overflow-y: auto;
        }

        .password-display-wrapper:hover {
            border-color: var(--primary);
        }

        .password-text {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--accent);
            word-break: break-all;
            text-align: center;
            line-height: 1.4;
            margin: 0.25rem 0;
            letter-spacing: 1px;
        }

        .password-text.bulk {
            font-size: 1.1rem;
            text-align: left;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        
        .password-text.bulk:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Strength Meter */
        .strength-section {
            margin: 1.5rem 0;
        }

        .strength-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .strength-bars {
            display: flex;
            gap: 5px;
            height: 6px;
        }

        .bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            transition: background 0.4s ease;
        }

        /* Settings */
        .setting-group {
            margin-bottom: 1.5rem;
        }
        
        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 10px rgba(108, 99, 255, 0.5);
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--accent);
            box-shadow: 0 0 15px rgba(0, 212, 170, 0.5);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-wrapper input {
            display: none;
        }

        .checkmark {
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .checkmark i {
            color: transparent;
            font-size: 12px;
            transition: color 0.3s ease;
        }

        .checkbox-wrapper input:checked + .checkmark {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-wrapper input:checked + .checkmark i {
            color: white;
        }

        .checkbox-label {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        /* Custom scrollbar for wrapper */
        .password-display-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .password-display-wrapper::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .password-display-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .checkbox-grid {
                grid-template-columns: 1fr;
            }
            .actions {
                flex-direction: column;
            }
            .password-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="../../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> ToolsHub
            </a>
        </div>
    </header>

    <main>
        <div class="container">
            <h1 class="page-title">Password Generator</h1>

            <div class="glass-card">
                <div class="output-section">
                    <div class="password-display-wrapper" id="passwordDisplay">
                        <!-- Passwords go here -->
                    </div>
                    <div class="actions">
                        <button class="btn btn-secondary" id="btnCopy">
                            <i class="far fa-copy"></i> Copy
                        </button>
                        <button class="btn btn-primary" id="btnGenerate">
                            <i class="fas fa-sync-alt"></i> Regenerate
                        </button>
                    </div>
                </div>

                <div class="strength-section">
                    <div class="strength-header">
                        <span>Password Strength</span>
                        <span id="strengthLabel" style="font-weight: 600; color: var(--text-muted);">Medium</span>
                    </div>
                    <div class="strength-bars">
                        <div class="bar" id="bar1"></div>
                        <div class="bar" id="bar2"></div>
                        <div class="bar" id="bar3"></div>
                        <div class="bar" id="bar4"></div>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="setting-group">
                    <div class="setting-header">
                        <span>Password Length</span>
                        <span id="lengthValue">16</span>
                    </div>
                    <input type="range" id="lengthSlider" class="range-slider" min="4" max="128" value="16">
                </div>

                <div class="setting-group">
                    <div class="setting-header">
                        <span>Number of Passwords</span>
                        <span id="countValue">1</span>
                    </div>
                    <input type="range" id="countSlider" class="range-slider" min="1" max="10" value="1">
                </div>

                <div class="setting-group">
                    <div class="checkbox-grid">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="chkUpper" checked>
                            <div class="checkmark"><i class="fas fa-check"></i></div>
                            <span class="checkbox-label">Uppercase (A-Z)</span>
                        </label>
                        
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="chkLower" checked>
                            <div class="checkmark"><i class="fas fa-check"></i></div>
                            <span class="checkbox-label">Lowercase (a-z)</span>
                        </label>

                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="chkNumbers" checked>
                            <div class="checkmark"><i class="fas fa-check"></i></div>
                            <span class="checkbox-label">Numbers (0-9)</span>
                        </label>

                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="chkSymbols" checked>
                            <div class="checkmark"><i class="fas fa-check"></i></div>
                            <span class="checkbox-label">Symbols (!@#$...)</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const DOM = {
            display: document.getElementById('passwordDisplay'),
            btnCopy: document.getElementById('btnCopy'),
            btnGenerate: document.getElementById('btnGenerate'),
            lengthSlider: document.getElementById('lengthSlider'),
            lengthValue: document.getElementById('lengthValue'),
            countSlider: document.getElementById('countSlider'),
            countValue: document.getElementById('countValue'),
            chkUpper: document.getElementById('chkUpper'),
            chkLower: document.getElementById('chkLower'),
            chkNumbers: document.getElementById('chkNumbers'),
            chkSymbols: document.getElementById('chkSymbols'),
            strengthLabel: document.getElementById('strengthLabel'),
            bars: [
                document.getElementById('bar1'),
                document.getElementById('bar2'),
                document.getElementById('bar3'),
                document.getElementById('bar4')
            ]
        };

        const CHARS = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
        };

        let currentPasswords = [];

        function generatePassword(length, options) {
            let charset = '';
            if (options.upper) charset += CHARS.upper;
            if (options.lower) charset += CHARS.lower;
            if (options.numbers) charset += CHARS.numbers;
            if (options.symbols) charset += CHARS.symbols;

            if (charset === '') {
                return '';
            }

            let password = '';
            const array = new Uint32Array(length);
            window.crypto.getRandomValues(array);

            // Ensure at least one char of each selected type if length allows
            let guaranteed = [];
            if (options.upper) guaranteed.push(CHARS.upper[Math.floor(Math.random() * CHARS.upper.length)]);
            if (options.lower) guaranteed.push(CHARS.lower[Math.floor(Math.random() * CHARS.lower.length)]);
            if (options.numbers) guaranteed.push(CHARS.numbers[Math.floor(Math.random() * CHARS.numbers.length)]);
            if (options.symbols) guaranteed.push(CHARS.symbols[Math.floor(Math.random() * CHARS.symbols.length)]);

            for (let i = 0; i < length; i++) {
                if (i < guaranteed.length) {
                    password += guaranteed[i];
                } else {
                    password += charset[array[i] % charset.length];
                }
            }

            // Shuffle
            return password.split('').sort(() => 0.5 - Math.random()).join('');
        }

        function calculateStrength(password) {
            let score = 0;
            if (!password) return 0;
            if (password.length > 8) score += 1;
            if (password.length > 12) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;

            if (score > 4) score = 4;
            return score;
        }

        function updateStrengthMeter(password) {
            const score = calculateStrength(password);
            
            const colors = ['rgba(255,255,255,0.1)', 'var(--danger)', 'var(--warning)', 'var(--caution)', 'var(--success)'];
            const labels = ['Too Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];

            DOM.strengthLabel.textContent = score === 0 ? '-' : labels[score];
            DOM.strengthLabel.style.color = score === 0 ? 'var(--text-muted)' : colors[score];

            DOM.bars.forEach((bar, index) => {
                if (index < score) {
                    bar.style.background = colors[score];
                } else {
                    bar.style.background = 'rgba(255,255,255,0.1)';
                }
            });
        }

        function generateAndUpdate() {
            const length = parseInt(DOM.lengthSlider.value);
            const count = parseInt(DOM.countSlider.value);
            const options = {
                upper: DOM.chkUpper.checked,
                lower: DOM.chkLower.checked,
                numbers: DOM.chkNumbers.checked,
                symbols: DOM.chkSymbols.checked
            };

            // Force at least one option
            if (!options.upper && !options.lower && !options.numbers && !options.symbols) {
                DOM.chkLower.checked = true;
                options.lower = true;
            }

            currentPasswords = [];
            DOM.display.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const pass = generatePassword(length, options);
                currentPasswords.push(pass);
                
                const div = document.createElement('div');
                div.className = count > 1 ? 'password-text bulk' : 'password-text';
                div.textContent = pass;
                DOM.display.appendChild(div);
            }

            // Update strength based on first password
            updateStrengthMeter(currentPasswords[0]);
        }

        async function copyToClipboard() {
            if (currentPasswords.length === 0) return;
            
            const textToCopy = currentPasswords.join('\n');
            try {
                await navigator.clipboard.writeText(textToCopy);
                
                const originalHTML = DOM.btnCopy.innerHTML;
                DOM.btnCopy.innerHTML = '<i class="fas fa-check" style="color:var(--success)"></i> Copied!';
                setTimeout(() => {
                    DOM.btnCopy.innerHTML = originalHTML;
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        }

        // Event Listeners
        DOM.lengthSlider.addEventListener('input', (e) => {
            DOM.lengthValue.textContent = e.target.value;
            generateAndUpdate();
        });

        DOM.countSlider.addEventListener('input', (e) => {
            DOM.countValue.textContent = e.target.value;
            generateAndUpdate();
        });

        const updateEvents = ['change', 'input'];
        [DOM.chkUpper, DOM.chkLower, DOM.chkNumbers, DOM.chkSymbols].forEach(el => {
            el.addEventListener('change', generateAndUpdate);
        });

        DOM.btnGenerate.addEventListener('click', generateAndUpdate);
        DOM.btnCopy.addEventListener('click', copyToClipboard);

        // Initial Generation
        generateAndUpdate();
    </script>
</body>
</html>
