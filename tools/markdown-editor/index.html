<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online Markdown Editor & Live Previewer. Write, edit, and preview markdown in real-time. Export to HTML or MD.">
    <title>Markdown Editor & Live Previewer - Free No-Signup Tool | ToolsHub</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --primary: #6C63FF;
            --accent: #00D4AA;
            --bg-color: #0a0a1a;
            --card-bg: rgba(18, 18, 42, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f0f0f0;
            --text-muted: #a0a0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(108, 99, 255, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(0, 212, 170, 0.15), transparent 25%);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .brand a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }
        
        .brand a:hover {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(108, 99, 255, 0.3);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: #5b54d6;
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.5);
        }
        
        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 600;
        }
        
        .btn-accent:hover {
            background: #00b591;
            box-shadow: 0 0 15px rgba(0, 212, 170, 0.5);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            background: rgba(18, 18, 42, 0.5);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .toolbar button {
            padding: 0.4rem 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 0.5rem;
        }

        /* Main Workspace */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 1rem;
            gap: 1rem;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            min-width: 0; /* To prevent flex overflow */
        }

        .pane-header {
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
        }

        .editor-container {
            flex: 1;
            display: flex;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 1rem;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .preview-container {
            flex: 1;
            padding: 1rem 1.5rem;
            overflow-y: auto;
            color: #d1d5db;
        }

        /* Markdown Styles in Preview */
        .preview-container h1, .preview-container h2, .preview-container h3, 
        .preview-container h4, .preview-container h5, .preview-container h6 {
            color: var(--text-main);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.2;
        }
        
        .preview-container h1:first-child, .preview-container h2:first-child, .preview-container h3:first-child {
            margin-top: 0;
        }

        .preview-container h1 { font-size: 2em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        .preview-container h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        
        .preview-container p { margin-bottom: 1em; line-height: 1.6; }
        
        .preview-container a { color: var(--accent); text-decoration: none; }
        .preview-container a:hover { text-decoration: underline; }
        
        .preview-container code {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            color: #e06c75;
        }
        
        .preview-container pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 1em;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 1em;
            border: 1px solid var(--border-color);
        }
        
        .preview-container pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .preview-container blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 1em;
            color: var(--text-muted);
            margin-bottom: 1em;
            background: rgba(108, 99, 255, 0.05);
            padding: 0.5em 1em;
            border-radius: 0 4px 4px 0;
        }

        .preview-container ul, .preview-container ol {
            margin-bottom: 1em;
            padding-left: 2em;
        }

        .preview-container li { margin-bottom: 0.25em; }

        .preview-container table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1em;
        }
        
        .preview-container th, .preview-container td {
            border: 1px solid var(--border-color);
            padding: 0.5em 1em;
            text-align: left;
        }
        
        .preview-container th {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .preview-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        /* Footer Stats */
        footer {
            padding: 0.75rem 2rem;
            background: rgba(18, 18, 42, 0.8);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .stat-value {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* Responsive */
        @media (max-width: 768px) {
            main { flex-direction: column; }
            .pane { min-height: 40vh; }
            .toolbar { padding: 0.5rem 1rem; }
            header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .header-actions { flex-wrap: wrap; }
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <a href="../../index.html">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                ToolsHub
            </a>
        </div>
        <div class="header-actions">
            <button id="btn-sample">Sample</button>
            <button id="btn-clear">Clear</button>
            <button id="btn-copy-md">Copy MD</button>
            <button id="btn-copy-html">Copy HTML</button>
            <button id="btn-dl-md" class="btn-primary">⬇ .md</button>
            <button id="btn-dl-html" class="btn-accent">⬇ .html</button>
        </div>
    </header>

    <div class="toolbar">
        <button data-action="bold" title="Bold"><b>B</b></button>
        <button data-action="italic" title="Italic"><i>I</i></button>
        <div class="toolbar-divider"></div>
        <button data-action="h1" title="Heading 1">H1</button>
        <button data-action="h2" title="Heading 2">H2</button>
        <button data-action="h3" title="Heading 3">H3</button>
        <div class="toolbar-divider"></div>
        <button data-action="link" title="Link">🔗</button>
        <button data-action="image" title="Image">🖼️</button>
        <button data-action="code" title="Code Block">{ }</button>
        <button data-action="quote" title="Blockquote">”</button>
        <div class="toolbar-divider"></div>
        <button data-action="ul" title="Unordered List">• List</button>
        <button data-action="ol" title="Ordered List">1. List</button>
        <button data-action="table" title="Table">Table</button>
    </div>

    <main>
        <div class="pane">
            <div class="pane-header">
                <span>Editor</span>
            </div>
            <div class="editor-container">
                <textarea id="editor" placeholder="Type your markdown here..."></textarea>
            </div>
        </div>

        <div class="pane">
            <div class="pane-header">
                <span>Preview</span>
            </div>
            <div id="preview" class="preview-container"></div>
        </div>
    </main>

    <footer>
        <div class="stat">Words: <span id="word-count" class="stat-value">0</span></div>
        <div class="stat">Characters: <span id="char-count" class="stat-value">0</span></div>
        <div class="stat">Reading Time: <span id="read-time" class="stat-value">0 min</span></div>
    </footer>
    
    <div id="toast" class="toast">Action successful!</div>

    <script>
        // DOM Elements
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const wordCountEl = document.getElementById('word-count');
        const charCountEl = document.getElementById('char-count');
        const readTimeEl = document.getElementById('read-time');
        const toast = document.getElementById('toast');
        
        // Configure marked.js to allow GitHub Flavored Markdown
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        const sampleMarkdown = `# Welcome to the Markdown Editor! 👋

This is a **live preview** editor. As you type on the left, the output renders on the right.

## Features
* **Real-time parsing:** Powered by Marked.js
* **Sync Scrolling:** Editor and preview scroll together
* **Export:** Download as \`.md\` or \`.html\`
* **No backend:** 100% client-side privacy

### Text Formatting
You can use *italic*, **bold**, \`inline code\`, or ~~strikethrough~~.

### Code Blocks
\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}
console.log(greet('ToolsHub User'));
\`\`\`

### Blockquotes
> "Markdown is a text-to-HTML conversion tool for web writers." 
> — John Gruber

### Tables
| Feature | Supported |
|---------|:---------:|
| Dark Mode | ✅ |
| Live Stats | ✅ |
| Glassmorphism | ✅ |

### Links and Images
[Visit ToolsHub](../../index.html)

![Placeholder Image](https://via.placeholder.com/600x200/6C63FF/FFFFFF?text=Markdown+Editor+Banner)
`;

        // Update preview and stats
        function updateAll() {
            const text = editor.value;
            
            // Update Preview
            preview.innerHTML = marked.parse(text);
            
            // Update Stats
            const textWithoutMarkdown = text.replace(/[#_*\\[\\]()<>`~]/g, '');
            const words = textWithoutMarkdown.trim().split(/\\s+/).filter(w => w.length > 0).length;
            const chars = text.length;
            
            wordCountEl.textContent = words;
            charCountEl.textContent = chars;
            
            // Average reading speed: 225 words per minute
            const readTime = Math.ceil(words / 225) || (words > 0 ? 1 : 0);
            readTimeEl.textContent = \`\${readTime} min\`;
        }

        // Event Listeners
        editor.addEventListener('input', updateAll);

        // Sync Scrolling
        let isSyncingLeft = false;
        let isSyncingRight = false;

        editor.addEventListener('scroll', function() {
            if (!isSyncingLeft) {
                isSyncingRight = true;
                const percentage = this.scrollTop / (this.scrollHeight - this.clientHeight || 1);
                preview.scrollTop = percentage * (preview.scrollHeight - preview.clientHeight);
            }
            isSyncingLeft = false;
        });

        preview.addEventListener('scroll', function() {
            if (!isSyncingRight) {
                isSyncingLeft = true;
                const percentage = this.scrollTop / (this.scrollHeight - this.clientHeight || 1);
                editor.scrollTop = percentage * (editor.scrollHeight - editor.clientHeight);
            }
            isSyncingRight = false;
        });

        // Toolbar Actions
        const actions = {
            'bold': { prefix: '**', suffix: '**', defaultText: 'bold text' },
            'italic': { prefix: '*', suffix: '*', defaultText: 'italic text' },
            'h1': { prefix: '# ', suffix: '', defaultText: 'Heading 1' },
            'h2': { prefix: '## ', suffix: '', defaultText: 'Heading 2' },
            'h3': { prefix: '### ', suffix: '', defaultText: 'Heading 3' },
            'link': { prefix: '[', suffix: '](url)', defaultText: 'link text' },
            'image': { prefix: '![', suffix: '](image-url)', defaultText: 'alt text' },
            'code': { prefix: '\\n\`\`\`\\n', suffix: '\\n\`\`\`\\n', defaultText: 'code block' },
            'quote': { prefix: '> ', suffix: '', defaultText: 'quote' },
            'ul': { prefix: '- ', suffix: '', defaultText: 'list item' },
            'ol': { prefix: '1. ', suffix: '', defaultText: 'list item' },
            'table': { 
                prefix: '\\n| Header 1 | Header 2 |\\n| -------- | -------- |\\n| ', 
                suffix: ' | Cell 2 |\\n', 
                defaultText: 'Cell 1' 
            }
        };

        document.querySelectorAll('.toolbar button').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.getAttribute('data-action');
                if (actions[action]) {
                    insertText(actions[action]);
                }
            });
        });

        function insertText({ prefix, suffix, defaultText }) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.substring(start, end);
            
            const replacement = selectedText || defaultText;
            const textToInsert = prefix + replacement + suffix;
            
            editor.setRangeText(textToInsert, start, end, 'select');
            
            // Adjust selection to only highlight the inner text if nothing was previously selected
            if (!selectedText) {
                editor.selectionStart = start + prefix.length;
                editor.selectionEnd = editor.selectionStart + replacement.length;
            } else {
                editor.selectionStart = start;
                editor.selectionEnd = start + textToInsert.length;
            }
            
            editor.focus();
            updateAll();
        }
        
        // Helper: Show Toast
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Header Actions
        document.getElementById('btn-sample').addEventListener('click', () => {
            editor.value = sampleMarkdown;
            updateAll();
            showToast('Sample loaded');
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            if(confirm('Are you sure you want to clear the editor?')) {
                editor.value = '';
                updateAll();
                editor.focus();
                showToast('Editor cleared');
            }
        });

        document.getElementById('btn-copy-md').addEventListener('click', () => {
            navigator.clipboard.writeText(editor.value).then(() => {
                showToast('Markdown copied to clipboard!');
            }).catch(() => {
                showToast('Failed to copy text');
            });
        });

        document.getElementById('btn-copy-html').addEventListener('click', () => {
            const html = marked.parse(editor.value);
            navigator.clipboard.writeText(html).then(() => {
                showToast('HTML copied to clipboard!');
            }).catch(() => {
                showToast('Failed to copy HTML');
            });
        });

        document.getElementById('btn-dl-md').addEventListener('click', () => {
            downloadFile(editor.value, 'document.md', 'text/markdown');
        });

        document.getElementById('btn-dl-html').addEventListener('click', () => {
            const fullHtml = \`<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Exported Document</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 2rem; max-width: 800px; margin: 0 auto; color: #333; }
  h1, h2, h3 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
  code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; }
  pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
  pre code { background: transparent; padding: 0; }
  blockquote { border-left: 4px solid #dfe2e5; color: #6a737d; padding: 0 1em; margin: 0; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  th, td { border: 1px solid #dfe2e5; padding: 6px 13px; }
  th { background-color: #f6f8fa; }
  img { max-width: 100%; }
</style>
</head>
<body>
\${marked.parse(editor.value)}
</body>
</html>\`;
            downloadFile(fullHtml, 'document.html', 'text/html');
        });

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(\`Downloaded \${fileName}\`);
        }

        // Initialize empty editor
        
        // Load sample initially for better first impression
        editor.value = sampleMarkdown;
        updateAll();
    </script>
</body>
</html>
