<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Create QR Codes Free Online | ToolsHub</title>
    <meta name="description" content="Generate custom QR codes for URLs, text, Wi-Fi, email, and phone numbers. Free, easy, and secure QR code creator.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a1a;
            --card-bg: rgba(18, 18, 42, 0.8);
            --primary: #6C63FF;
            --primary-hover: #5a52d9;
            --accent: #00D4AA;
            --text-main: #ffffff;
            --text-muted: #a0a0c0;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(108, 99, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 212, 170, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        header {
            padding: 2rem;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1rem;
            transition: transform 0.2s ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .back-link svg {
            margin-right: 0.5rem;
            width: 20px;
            height: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .controls-panel {
            flex: 1;
            max-width: 600px;
        }

        .preview-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: sticky;
            top: 2rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem;
            border-radius: 12px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.2);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border);
            border-radius: 8px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .qr-container {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #qrcode img, #qrcode canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .qr-container:hover {
            transform: scale(1.02);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
        }

        @media (max-width: 900px) {
            main {
                flex-direction: column;
                align-items: center;
            }
            .preview-panel {
                width: 100%;
                max-width: 400px;
                position: static;
            }
            .controls-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to ToolsHub
        </a>
        <h1>QR Code Generator</h1>
        <p style="color: var(--text-muted);">Create custom QR codes instantly</p>
    </header>

    <main>
        <div class="glass-card controls-panel">
            <div class="tabs">
                <button class="tab-btn active" data-tab="url">URL</button>
                <button class="tab-btn" data-tab="text">Text</button>
                <button class="tab-btn" data-tab="wifi">Wi-Fi</button>
                <button class="tab-btn" data-tab="email">Email</button>
                <button class="tab-btn" data-tab="phone">Phone</button>
            </div>

            <div class="tab-content active" id="tab-url">
                <div class="form-group">
                    <label for="url-input">Website URL</label>
                    <input type="text" id="url-input" placeholder="https://example.com" value="https://example.com">
                </div>
            </div>

            <div class="tab-content" id="tab-text">
                <div class="form-group">
                    <label for="text-input">Your Text</label>
                    <textarea id="text-input" placeholder="Enter your text here..."></textarea>
                </div>
            </div>

            <div class="tab-content" id="tab-wifi">
                <div class="form-group">
                    <label for="wifi-ssid">Network Name (SSID)</label>
                    <input type="text" id="wifi-ssid" placeholder="MyWiFiNetwork">
                </div>
                <div class="form-group">
                    <label for="wifi-password">Password</label>
                    <input type="password" id="wifi-password" placeholder="Network Password">
                </div>
                <div class="form-group">
                    <label for="wifi-encryption">Encryption</label>
                    <select id="wifi-encryption">
                        <option value="WPA">WPA/WPA2/WPA3</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">None</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="checkbox" id="wifi-hidden" style="width: auto;">
                    <label for="wifi-hidden" style="margin: 0; cursor: pointer;">Hidden Network</label>
                </div>
            </div>

            <div class="tab-content" id="tab-email">
                <div class="form-group">
                    <label for="email-to">Email Address</label>
                    <input type="email" id="email-to" placeholder="contact@example.com">
                </div>
                <div class="form-group">
                    <label for="email-subject">Subject (Optional)</label>
                    <input type="text" id="email-subject" placeholder="Hello">
                </div>
                <div class="form-group">
                    <label for="email-body">Message (Optional)</label>
                    <textarea id="email-body" placeholder="Your message here..."></textarea>
                </div>
            </div>

            <div class="tab-content" id="tab-phone">
                <div class="form-group">
                    <label for="phone-input">Phone Number</label>
                    <input type="tel" id="phone-input" placeholder="+1234567890">
                </div>
            </div>

            <div class="settings-grid">
                <div class="form-group">
                    <label>Foreground Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="color-dark" value="#000000">
                        <span id="color-dark-hex">#000000</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Background Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="color-light" value="#ffffff">
                        <span id="color-light-hex">#ffffff</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="qr-size">Size: <span id="size-val">1024</span>px</label>
                    <input type="range" id="qr-size" min="128" max="2048" step="128" value="1024">
                </div>
                <div class="form-group">
                    <label for="qr-error">Error Correction</label>
                    <select id="qr-error">
                        <option value="L">Low (7%)</option>
                        <option value="M">Medium (15%)</option>
                        <option value="Q">Quartile (25%)</option>
                        <option value="H" selected>High (30%)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="preview-panel">
            <div class="qr-container" id="qr-container">
                <div id="qrcode"></div>
            </div>
            <button class="btn-primary" id="download-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download PNG
            </button>
        </div>
    </main>

    <script>
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            let currentTab = 'url';
            
            // UI Elements
            const qrcodeContainer = document.getElementById('qrcode');
            const downloadBtn = document.getElementById('download-btn');
            
            // Settings
            const colorDark = document.getElementById('color-dark');
            const colorLight = document.getElementById('color-light');
            const colorDarkHex = document.getElementById('color-dark-hex');
            const colorLightHex = document.getElementById('color-light-hex');
            const qrSize = document.getElementById('qr-size');
            const sizeVal = document.getElementById('size-val');
            const qrError = document.getElementById('qr-error');
            
            // Inputs
            const inputs = {
                url: document.getElementById('url-input'),
                text: document.getElementById('text-input'),
                wifi: {
                    ssid: document.getElementById('wifi-ssid'),
                    password: document.getElementById('wifi-password'),
                    encryption: document.getElementById('wifi-encryption'),
                    hidden: document.getElementById('wifi-hidden')
                },
                email: {
                    to: document.getElementById('email-to'),
                    subject: document.getElementById('email-subject'),
                    body: document.getElementById('email-body')
                },
                phone: document.getElementById('phone-input')
            };

            let qrCode = null;

            function updateColorLabels() {
                colorDarkHex.textContent = colorDark.value.toUpperCase();
                colorLightHex.textContent = colorLight.value.toUpperCase();
            }

            function getQRData() {
                switch(currentTab) {
                    case 'url':
                        return inputs.url.value || 'https://example.com';
                    case 'text':
                        return inputs.text.value || 'Hello, World!';
                    case 'wifi':
                        const ssid = inputs.wifi.ssid.value;
                        const pwd = inputs.wifi.password.value;
                        const enc = inputs.wifi.encryption.value;
                        const hidden = inputs.wifi.hidden.checked ? 'true' : 'false';
                        
                        if (!ssid) return 'WIFI:S:;T:nopass;P:;H:false;;';
                        
                        let wifiStr = `WIFI:S:${ssid};T:${enc};`;
                        if (enc !== 'nopass') {
                            wifiStr += `P:${pwd};`;
                        }
                        wifiStr += `H:${hidden};;`;
                        return wifiStr;
                    case 'email':
                        const to = inputs.email.to.value;
                        const sub = inputs.email.subject.value;
                        const body = inputs.email.body.value;
                        
                        if (!to) return 'mailto:';
                        
                        return `mailto:${to}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
                    case 'phone':
                        const phone = inputs.phone.value;
                        return phone ? `tel:${phone}` : 'tel:';
                    default:
                        return '';
                }
            }

            function generateQR() {
                const data = getQRData();
                const size = parseInt(qrSize.value);
                const errorCorrectionLevel = QRCode.CorrectLevel[qrError.value];
                
                qrcodeContainer.innerHTML = '';
                
                qrCode = new QRCode(qrcodeContainer, {
                    text: data,
                    width: size,
                    height: size,
                    colorDark : colorDark.value,
                    colorLight : colorLight.value,
                    correctLevel : errorCorrectionLevel
                });
            }

            // Tab Switching
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    document.getElementById(`tab-${currentTab}`).classList.add('active');
                    
                    generateQR();
                });
            });

            // Event Listeners for inputs
            const allInputs = document.querySelectorAll('input, textarea, select');
            allInputs.forEach(input => {
                input.addEventListener('input', () => {
                    if (input.id === 'color-dark' || input.id === 'color-light') {
                        updateColorLabels();
                    }
                    if (input.id === 'qr-size') {
                        sizeVal.textContent = input.value;
                    }
                    
                    // Add slight debounce for textareas and text inputs
                    clearTimeout(input.dataset.timeout);
                    input.dataset.timeout = setTimeout(() => {
                        generateQR();
                    }, 150);
                });
            });

            // Download functionality
            downloadBtn.addEventListener('click', () => {
                const canvas = qrcodeContainer.querySelector('canvas');
                const img = qrcodeContainer.querySelector('img');
                
                let dataUrl = '';
                if (canvas) {
                    dataUrl = canvas.toDataURL("image/png");
                } else if (img && img.src) {
                    dataUrl = img.src;
                }
                
                if (dataUrl) {
                    const link = document.createElement('a');
                    link.download = `qrcode-${currentTab}-${Date.now()}.png`;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            });

            // Initial setup
            updateColorLabels();
            generateQR();
        });
    </script>
</body>
</html>
