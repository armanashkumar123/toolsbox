<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger, Splitter & Compressor - 100% In-Browser Privacy | ToolsHub</title>
    <meta name="description" content="All-in-One PDF Tools Hub. Merge, split, rotate, and extract images from PDFs 100% locally in your browser. No server uploads for ultimate privacy.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #0A0A0F;
            --card-bg: rgba(17, 17, 24, 0.7);
            --border-glow: #00F0FF;
            --text-main: #E2E2E2;
            --text-muted: #8B8B99;
            --accent: #00F0FF;
            --accent-hover: #00C8D6;
            --danger: #FF3366;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.03), transparent 25%);
        }

        header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(10px);
            background: rgba(10, 10, 15, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: text-shadow 0.3s;
        }
        
        header a:hover {
            text-shadow: 0 0 10px var(--accent);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
        }

        .tab.active {
            color: var(--bg-color);
            background: var(--accent);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .tool-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tool-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropzone {
            border: 2px dashed rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1) inset;
        }

        .dropzone p {
            margin-top: 10px;
            color: var(--text-muted);
        }

        .btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            text-decoration: none;
        }

        .btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }

        .btn-danger:hover {
            background: #ff1a53;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* File List for Merging */
        .file-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: grab;
        }
        
        .file-item:active {
            cursor: grabbing;
        }

        .file-item .file-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .file-item .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 5px;
        }

        #output-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            display: none;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 240, 255, 0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Thumbnails */
        .thumbnails {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        .thumbnail-wrapper {
            position: relative;
            background: #fff;
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .thumbnail-wrapper canvas {
            max-width: 120px;
            height: auto;
            display: block;
        }
        .thumbnail-wrapper .page-num {
            position: absolute;
            bottom: -25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Utilities */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-2 { margin-top: 20px; }
        .mb-2 { margin-bottom: 20px; }

    </style>
</head>
<body>

    <header>
        <a href="../../index.html">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            ToolsHub
        </a>
    </header>

    <div class="container">
        <h1>All-in-One PDF Tools</h1>
        <p class="subtitle">Secure, local, in-browser processing. Zero uploads. 100% Privacy.</p>

        <div class="glass-panel">
            <div class="tabs">
                <button class="tab active" data-target="merge">Merge PDFs</button>
                <button class="tab" data-target="split">Split PDF</button>
                <button class="tab" data-target="rotate">Rotate Pages</button>
                <button class="tab" data-target="extract">Extract Images</button>
            </div>

            <!-- MERGE SECTION -->
            <div id="merge" class="tool-section active">
                <div class="dropzone" id="merge-dropzone">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p>Drag & Drop PDFs here, or click to browse</p>
                    <input type="file" id="merge-input" multiple accept="application/pdf" class="hidden">
                </div>
                <ul class="file-list" id="merge-list"></ul>
                <div class="text-center mt-2">
                    <button class="btn" id="btn-merge" disabled>Merge PDFs</button>
                </div>
            </div>

            <!-- SPLIT SECTION -->
            <div id="split" class="tool-section">
                <div class="dropzone" id="split-dropzone">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p>Select a PDF to Split</p>
                    <input type="file" id="split-input" accept="application/pdf" class="hidden">
                </div>
                <div id="split-controls" class="hidden">
                    <div class="form-group">
                        <label>Selected File</label>
                        <input type="text" id="split-filename" class="form-control" disabled>
                    </div>
                    <div class="form-group">
                        <label>Pages to Extract (e.g., 1, 3-5, 8)</label>
                        <input type="text" id="split-ranges" class="form-control" placeholder="1-3, 5, 7-9">
                    </div>
                    <div class="text-center">
                        <button class="btn" id="btn-split">Split PDF</button>
                    </div>
                </div>
            </div>

            <!-- ROTATE SECTION -->
            <div id="rotate" class="tool-section">
                <div class="dropzone" id="rotate-dropzone">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p>Select a PDF to Rotate</p>
                    <input type="file" id="rotate-input" accept="application/pdf" class="hidden">
                </div>
                <div id="rotate-controls" class="hidden">
                    <div class="form-group">
                        <label>Selected File</label>
                        <input type="text" id="rotate-filename" class="form-control" disabled>
                    </div>
                    <div class="form-group">
                        <label>Rotation Angle</label>
                        <select id="rotate-angle" class="form-control" style="background: rgba(0,0,0,0.5);">
                            <option value="90">90° Clockwise</option>
                            <option value="180">180°</option>
                            <option value="270">90° Counter-Clockwise</option>
                        </select>
                    </div>
                    <div class="text-center">
                        <button class="btn" id="btn-rotate">Rotate PDF</button>
                    </div>
                </div>
            </div>

            <!-- EXTRACT SECTION -->
            <div id="extract" class="tool-section">
                <div class="dropzone" id="extract-dropzone">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p>Select a PDF to Render & Extract Pages as Images</p>
                    <input type="file" id="extract-input" accept="application/pdf" class="hidden">
                </div>
                <div id="extract-controls" class="hidden">
                    <div class="form-group">
                        <label>Selected File</label>
                        <input type="text" id="extract-filename" class="form-control" disabled>
                    </div>
                    <div class="text-center">
                        <button class="btn" id="btn-extract">Generate Images</button>
                    </div>
                    <div class="thumbnails" id="extract-thumbnails"></div>
                </div>
            </div>

            <div class="loader" id="loader"></div>

            <div id="output-area">
                <h3 class="mb-2">Processing Complete!</h3>
                <a href="#" id="download-btn" class="btn" download>Download File</a>
            </div>

        </div>
    </div>

    <script>
        // Setup PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        // Tab Switching
        const tabs = document.querySelectorAll('.tab');
        const sections = document.querySelectorAll('.tool-section');
        const outputArea = document.getElementById('output-area');
        const loader = document.getElementById('loader');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
                outputArea.style.display = 'none';
            });
        });

        // Common Dropzone Logic
        function setupDropzone(dropzoneId, inputId, onFileSelect) {
            const dropzone = document.getElementById(dropzoneId);
            const input = document.getElementById(inputId);

            dropzone.addEventListener('click', () => input.click());
            
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    onFileSelect(e.dataTransfer.files);
                }
            });
            input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    onFileSelect(e.target.files);
                }
            });
        }

        // ====== MODE 1: MERGE ======
        let mergeFiles = [];
        const mergeList = document.getElementById('merge-list');
        const btnMerge = document.getElementById('btn-merge');

        setupDropzone('merge-dropzone', 'merge-input', (files) => {
            for (let f of files) {
                if (f.type === 'application/pdf') {
                    mergeFiles.push(f);
                }
            }
            renderMergeList();
        });

        function renderMergeList() {
            mergeList.innerHTML = '';
            mergeFiles.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.draggable = true;
                li.dataset.index = index;
                
                li.innerHTML = `
                    <span class="file-name">≡ ${file.name}</span>
                    <button class="remove-btn" onclick="removeMergeFile(${index})">×</button>
                `;

                // Basic Drag & Drop reordering
                li.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', index);
                });
                li.addEventListener('dragover', (e) => e.preventDefault());
                li.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIndex = e.dataTransfer.getData('text/plain');
                    const toIndex = index;
                    if (fromIndex !== toIndex) {
                        const [moved] = mergeFiles.splice(fromIndex, 1);
                        mergeFiles.splice(toIndex, 0, moved);
                        renderMergeList();
                    }
                });

                mergeList.appendChild(li);
            });
            btnMerge.disabled = mergeFiles.length < 2;
        }

        window.removeMergeFile = (index) => {
            mergeFiles.splice(index, 1);
            renderMergeList();
        };

        btnMerge.addEventListener('click', async () => {
            showLoader();
            try {
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();

                for (let file of mergeFiles) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const pdfBytes = await mergedPdf.save();
                showDownload(pdfBytes, 'merged_document.pdf');
            } catch (err) {
                alert('Error merging PDFs: ' + err.message);
            }
            hideLoader();
        });

        // ====== MODE 2: SPLIT ======
        let splitFile = null;
        setupDropzone('split-dropzone', 'split-input', (files) => {
            if (files[0] && files[0].type === 'application/pdf') {
                splitFile = files[0];
                document.getElementById('split-filename').value = splitFile.name;
                document.getElementById('split-controls').classList.remove('hidden');
                document.getElementById('split-dropzone').classList.add('hidden');
            }
        });

        document.getElementById('btn-split').addEventListener('click', async () => {
            const rangeStr = document.getElementById('split-ranges').value.trim();
            if (!rangeStr) return alert('Please enter page ranges');
            
            showLoader();
            try {
                const { PDFDocument } = PDFLib;
                const arrayBuffer = await splitFile.arrayBuffer();
                const pdf = await PDFDocument.load(arrayBuffer);
                const totalPages = pdf.getPageCount();
                
                // Parse ranges (e.g. "1-3, 5")
                const pagesToKeep = new Set();
                const parts = rangeStr.split(',').map(s => s.trim());
                for (let p of parts) {
                    if (p.includes('-')) {
                        let [start, end] = p.split('-').map(Number);
                        if (start > end) [start, end] = [end, start];
                        for (let i = start; i <= end; i++) pagesToKeep.add(i - 1);
                    } else {
                        pagesToKeep.add(Number(p) - 1);
                    }
                }

                const validPages = Array.from(pagesToKeep).filter(p => p >= 0 && p < totalPages).sort((a,b)=>a-b);
                if (validPages.length === 0) throw new Error('No valid pages selected');

                const newPdf = await PDFDocument.create();
                const copiedPages = await newPdf.copyPages(pdf, validPages);
                copiedPages.forEach((page) => newPdf.addPage(page));

                const pdfBytes = await newPdf.save();
                showDownload(pdfBytes, `split_${splitFile.name}`);
            } catch (err) {
                alert('Error splitting PDF: ' + err.message);
            }
            hideLoader();
        });

        // ====== MODE 3: ROTATE ======
        let rotateFile = null;
        setupDropzone('rotate-dropzone', 'rotate-input', (files) => {
            if (files[0] && files[0].type === 'application/pdf') {
                rotateFile = files[0];
                document.getElementById('rotate-filename').value = rotateFile.name;
                document.getElementById('rotate-controls').classList.remove('hidden');
                document.getElementById('rotate-dropzone').classList.add('hidden');
            }
        });

        document.getElementById('btn-rotate').addEventListener('click', async () => {
            showLoader();
            try {
                const { PDFDocument, degrees } = PDFLib;
                const arrayBuffer = await rotateFile.arrayBuffer();
                const pdf = await PDFDocument.load(arrayBuffer);
                
                const angle = Number(document.getElementById('rotate-angle').value);
                const pages = pdf.getPages();
                pages.forEach(page => {
                    const currentRotation = page.getRotation().angle;
                    page.setRotation(degrees(currentRotation + angle));
                });

                const pdfBytes = await pdf.save();
                showDownload(pdfBytes, `rotated_${rotateFile.name}`);
            } catch (err) {
                alert('Error rotating PDF: ' + err.message);
            }
            hideLoader();
        });

        // ====== MODE 4: EXTRACT / RENDER ======
        let extractFile = null;
        setupDropzone('extract-dropzone', 'extract-input', (files) => {
            if (files[0] && files[0].type === 'application/pdf') {
                extractFile = files[0];
                document.getElementById('extract-filename').value = extractFile.name;
                document.getElementById('extract-controls').classList.remove('hidden');
                document.getElementById('extract-dropzone').classList.add('hidden');
                document.getElementById('extract-thumbnails').innerHTML = '';
            }
        });

        document.getElementById('btn-extract').addEventListener('click', async () => {
            showLoader();
            const container = document.getElementById('extract-thumbnails');
            container.innerHTML = '';
            try {
                const arrayBuffer = await extractFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale });
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'thumbnail-wrapper mb-2';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    // Add download overlay/button or just let user right click, we'll add a tiny link
                    const numLabel = document.createElement('div');
                    numLabel.className = 'page-num';
                    numLabel.innerHTML = `Page ${pageNum} <br><a href="${canvas.toDataURL('image/png')}" download="page_${pageNum}.png" style="color:var(--accent); font-size:12px;">Save PNG</a>`;
                    
                    wrapper.appendChild(canvas);
                    wrapper.appendChild(numLabel);
                    container.appendChild(wrapper);
                }
            } catch (err) {
                alert('Error extracting pages: ' + err.message);
            }
            hideLoader();
        });

        // ====== UTILS ======
        function showLoader() {
            loader.style.display = 'block';
            outputArea.style.display = 'none';
        }
        function hideLoader() {
            loader.style.display = 'none';
        }
        function showDownload(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const btn = document.getElementById('download-btn');
            btn.href = url;
            btn.download = filename;
            outputArea.style.display = 'block';
        }
    </script>
</body>
</html>
