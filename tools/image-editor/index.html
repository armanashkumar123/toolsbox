<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Editor & Background Remover - Free In-Browser Tool | ToolsHub</title>
    <meta name="description" content="Free client-side image editor and background remover. Apply filters, crop, resize, and edit images right in your browser.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0A0A0F;
            --card-bg: rgba(17, 17, 24, 0.7);
            --card-border: rgba(0, 240, 255, 0.15);
            --accent-cyan: #00F0FF;
            --accent-purple: #B200FF;
            --text-main: #FFFFFF;
            --text-muted: #8B8B99;
            --glass-blur: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(178, 0, 255, 0.05), transparent 25%);
        }

        /* Header */
        header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--card-border);
            z-index: 10;
        }

        .brand-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: text-shadow 0.3s ease;
        }
        
        .brand-link:hover {
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .brand-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        h1 {
            margin-left: 20px;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-muted);
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 20px;
        }

        /* Layout */
        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 70px);
        }

        .sidebar {
            width: 320px;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Custom Scrollbar for Sidebar */
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 3px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.5); }

        .workspace {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02)), 
                linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02));
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group h3 {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group h3::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--accent-cyan), transparent);
            opacity: 0.3;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            margin: 8px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        button {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: translateY(-1px);
        }

        button.primary {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        button.primary:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .upload-area {
            border: 2px dashed rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .upload-area svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-cyan);
            opacity: 0.8;
        }

        input[type="file"] {
            display: none;
        }

        /* Canvas Wrapper */
        .canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        
        .canvas-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .canvas-container::-webkit-scrollbar-track { background: transparent; }
        .canvas-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
            transform-origin: center center;
        }

        /* Input group for resize */
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-group input[type="number"] {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
            width: 100%;
        }

        select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
            width: 100%;
            margin-bottom: 10px;
            outline: none;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(17, 17, 24, 0.9);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .sidebar {
                width: 100%;
                order: 2;
            }
            .workspace {
                order: 1;
                min-height: 50vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html" class="brand-link">
            <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/></svg>
            ToolsHub
        </a>
        <h1>Image Editor & Background Remover</h1>
    </header>

    <div class="container">
        
        <div class="sidebar">
            
            <!-- Upload -->
            <div class="control-group">
                <label for="imageUpload" class="upload-area" id="dropZone">
                    <svg viewBox="0 0 24 24"><path d="M14,13V17H10V13H7L12,8L17,13H14M19.35,10.03C18.67,6.59 15.64,4 12,4C9.11,4 6.6,5.64 5.35,8.03C2.34,8.36 0,10.9 0,14C0,17.31 2.69,20 6,20H19C21.76,20 24,17.76 24,15C24,12.36 21.95,10.22 19.35,10.03Z"/></svg>
                    <span>Click or Drag & Drop Image</span>
                </label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <!-- Transform -->
            <div class="control-group">
                <h3>Transform</h3>
                <div class="btn-grid">
                    <button id="btnRotateLeft">Rotate -90°</button>
                    <button id="btnRotateRight">Rotate 90°</button>
                    <button id="btnFlipH">Flip H</button>
                    <button id="btnFlipV">Flip V</button>
                </div>
            </div>

            <!-- Resize -->
            <div class="control-group">
                <h3>Resize (px)</h3>
                <div class="input-group">
                    <input type="number" id="resizeW" placeholder="Width">
                    <span style="color:var(--text-muted)">x</span>
                    <input type="number" id="resizeH" placeholder="Height">
                </div>
                <button id="btnResize">Apply Resize</button>
            </div>

            <!-- Filters -->
            <div class="control-group">
                <h3>Filters</h3>
                
                <label>Brightness <span id="valBright">100%</span></label>
                <input type="range" id="filterBright" min="0" max="200" value="100">

                <label>Contrast <span id="valContrast">100%</span></label>
                <input type="range" id="filterContrast" min="0" max="200" value="100">

                <label>Saturation <span id="valSat">100%</span></label>
                <input type="range" id="filterSat" min="0" max="200" value="100">

                <label>Blur (px) <span id="valBlur">0px</span></label>
                <input type="range" id="filterBlur" min="0" max="20" value="0">

                <div class="btn-grid" style="margin-top: 10px;">
                    <button id="btnGrayscale">Grayscale</button>
                    <button id="btnSepia">Sepia</button>
                    <button id="btnInvert">Invert</button>
                    <button id="btnCyberpunk" style="color:var(--accent-purple); border-color:var(--accent-purple);">Cyberpunk</button>
                </div>
                <button id="btnResetFilters" style="margin-top: 5px;">Reset Filters</button>
            </div>

            <!-- Background Remover -->
            <div class="control-group">
                <h3>BG Removal (Magic Wand)</h3>
                <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:5px;">Click on the canvas to pick a color to remove.</p>
                <label>Tolerance <span id="valTolerance">30</span></label>
                <input type="range" id="bgTolerance" min="0" max="100" value="30">
                <button id="btnRemoveBgMode">Enable Magic Eraser Mode</button>
            </div>

            <!-- Download -->
            <div class="control-group" style="margin-top: auto;">
                <h3>Export</h3>
                <select id="exportFormat">
                    <option value="image/png">PNG (Transparent)</option>
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/webp">WebP</option>
                </select>
                <label>Quality <span id="valQuality">0.9</span></label>
                <input type="range" id="exportQuality" min="0.1" max="1" step="0.1" value="0.9">
                <button id="btnDownload" class="primary">Download Image</button>
            </div>

        </div>

        <div class="workspace" id="workspace">
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
            </div>
            <!-- Empty state -->
            <div id="emptyState" style="position: absolute; display:flex; flex-direction:column; align-items:center; gap:20px; pointer-events:none; opacity:0.5;">
                <svg viewBox="0 0 24 24" style="width:64px; height:64px; fill:var(--text-muted);"><path d="M19,19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/></svg>
                <p>No image loaded</p>
            </div>
        </div>

    </div>

    <div class="toast" id="toast">Message</div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // State
        let originalImage = null;
        let currentImage = null; // Stored as offscreen canvas to keep transforms
        
        let transforms = {
            rotate: 0,
            flipH: 1,
            flipV: 1
        };

        let filters = {
            bright: 100,
            contrast: 100,
            sat: 100,
            blur: 0,
            custom: '' // grayscale, sepia, invert, cyberpunk
        };

        let isBgRemovalMode = false;

        // UI Elements
        const dropZone = document.getElementById('dropZone');
        const imageUpload = document.getElementById('imageUpload');
        const emptyState = document.getElementById('emptyState');
        const workspace = document.getElementById('workspace');

        // Functions
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function loadImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('Please upload a valid image file.');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    resetState();
                    applyTransformations();
                    emptyState.style.display = 'none';
                    
                    document.getElementById('resizeW').value = img.width;
                    document.getElementById('resizeH').value = img.height;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetState() {
            transforms = { rotate: 0, flipH: 1, flipV: 1 };
            resetFilters();
            isBgRemovalMode = false;
            document.getElementById('btnRemoveBgMode').textContent = 'Enable Magic Eraser Mode';
            document.getElementById('btnRemoveBgMode').style.background = '';
        }

        function resetFilters() {
            filters = { bright: 100, contrast: 100, sat: 100, blur: 0, custom: '' };
            document.getElementById('filterBright').value = 100;
            document.getElementById('filterContrast').value = 100;
            document.getElementById('filterSat').value = 100;
            document.getElementById('filterBlur').value = 0;
            updateFilterValues();
        }

        function updateFilterValues() {
            document.getElementById('valBright').textContent = filters.bright + '%';
            document.getElementById('valContrast').textContent = filters.contrast + '%';
            document.getElementById('valSat').textContent = filters.sat + '%';
            document.getElementById('valBlur').textContent = filters.blur + 'px';
        }

        // Apply Rotate & Flip (changes canvas size)
        function applyTransformations() {
            if (!originalImage) return;

            // Calculate new dimensions
            const rad = transforms.rotate * Math.PI / 180;
            const w = originalImage.width;
            const h = originalImage.height;
            
            let newW = Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad));
            let newH = Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad));
            
            canvas.width = newW;
            canvas.height = newH;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.rotate(rad);
            ctx.scale(transforms.flipH, transforms.flipV);
            ctx.drawImage(originalImage, -w/2, -h/2);
            ctx.restore();

            // Save transformed image to currentImage (offscreen)
            currentImage = document.createElement('canvas');
            currentImage.width = canvas.width;
            currentImage.height = canvas.height;
            currentImage.getContext('2d').drawImage(canvas, 0, 0);

            applyFilters();
        }

        // Apply CSS Filters directly to canvas drawing
        function applyFilters() {
            if (!currentImage) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let filterStr = `brightness(${filters.bright}%) contrast(${filters.contrast}%) saturate(${filters.sat}%) blur(${filters.blur}px)`;
            
            if (filters.custom === 'grayscale') filterStr += ' grayscale(100%)';
            if (filters.custom === 'sepia') filterStr += ' sepia(100%)';
            if (filters.custom === 'invert') filterStr += ' invert(100%)';
            if (filters.custom === 'cyberpunk') filterStr += ' contrast(150%) saturate(200%) hue-rotate(30deg) drop-shadow(0 0 10px #00F0FF)';

            ctx.filter = filterStr;
            ctx.drawImage(currentImage, 0, 0);
            ctx.filter = 'none'; // reset
        }

        // --- Event Listeners ---

        // File Upload
        imageUpload.addEventListener('change', (e) => loadImage(e.target.files[0]));
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) loadImage(e.dataTransfer.files[0]);
        });

        // Transforms
        document.getElementById('btnRotateLeft').addEventListener('click', () => { transforms.rotate -= 90; applyTransformations(); });
        document.getElementById('btnRotateRight').addEventListener('click', () => { transforms.rotate += 90; applyTransformations(); });
        document.getElementById('btnFlipH').addEventListener('click', () => { transforms.flipH *= -1; applyTransformations(); });
        document.getElementById('btnFlipV').addEventListener('click', () => { transforms.flipV *= -1; applyTransformations(); });

        // Resize
        document.getElementById('btnResize').addEventListener('click', () => {
            if(!currentImage) return;
            const w = parseInt(document.getElementById('resizeW').value);
            const h = parseInt(document.getElementById('resizeH').value);
            if(w > 0 && h > 0) {
                // Resize current image
                const temp = document.createElement('canvas');
                temp.width = w;
                temp.height = h;
                temp.getContext('2d').drawImage(currentImage, 0, 0, w, h);
                originalImage = temp; // Set as new original
                resetState();
                applyTransformations();
                showToast(`Resized to ${w}x${h}`);
            }
        });

        // Filters
        const filterInputs = ['Bright', 'Contrast', 'Sat', 'Blur'];
        filterInputs.forEach(f => {
            document.getElementById(`filter${f}`).addEventListener('input', (e) => {
                filters[f.toLowerCase()] = e.target.value;
                updateFilterValues();
                applyFilters();
            });
        });

        document.getElementById('btnGrayscale').addEventListener('click', () => { filters.custom = 'grayscale'; applyFilters(); });
        document.getElementById('btnSepia').addEventListener('click', () => { filters.custom = 'sepia'; applyFilters(); });
        document.getElementById('btnInvert').addEventListener('click', () => { filters.custom = 'invert'; applyFilters(); });
        document.getElementById('btnCyberpunk').addEventListener('click', () => { filters.custom = 'cyberpunk'; applyFilters(); });
        document.getElementById('btnResetFilters').addEventListener('click', () => { resetFilters(); applyFilters(); });

        // Magic Eraser (Background Removal)
        const btnRemoveBgMode = document.getElementById('btnRemoveBgMode');
        btnRemoveBgMode.addEventListener('click', () => {
            if(!currentImage) return;
            isBgRemovalMode = !isBgRemovalMode;
            if(isBgRemovalMode) {
                btnRemoveBgMode.style.background = 'var(--accent-purple)';
                btnRemoveBgMode.style.color = '#fff';
                btnRemoveBgMode.textContent = 'Mode Active (Click Canvas)';
                canvas.style.cursor = 'crosshair';
            } else {
                btnRemoveBgMode.style.background = '';
                btnRemoveBgMode.style.color = '';
                btnRemoveBgMode.textContent = 'Enable Magic Eraser Mode';
                canvas.style.cursor = 'default';
            }
        });

        canvas.addEventListener('click', (e) => {
            if(!isBgRemovalMode || !currentImage) return;

            const rect = canvas.getBoundingClientRect();
            // Calculate scale in case CSS resizes canvas
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            removeColorAt(x, y);
        });

        function removeColorAt(startX, startY) {
            // Apply current filters to currentImage permanently before pixel manipulation
            // so we operate on the visual result.
            ctx.save();
            applyFilters();
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.restore();

            const data = imgData.data;
            
            // Get target color
            const startIndex = (startY * canvas.width + startX) * 4;
            const targetR = data[startIndex];
            const targetG = data[startIndex+1];
            const targetB = data[startIndex+2];
            const targetA = data[startIndex+3];

            if (targetA === 0) return; // already transparent

            const tolerance = parseInt(document.getElementById('bgTolerance').value);

            function colorMatch(r, g, b, a) {
                if (a === 0) return false;
                // Simple euclidean distance in RGB space
                const dr = r - targetR;
                const dg = g - targetG;
                const db = b - targetB;
                const dist = Math.sqrt(dr*dr + dg*dg + db*db);
                // Map distance to a 0-100 scale approx (max is ~441)
                return (dist / 4.41) <= tolerance;
            }

            // Simple flood fill or global replace. 
            // For a better tool, we do global color keying here.
            let removedCount = 0;
            for(let i=0; i<data.length; i+=4) {
                if(colorMatch(data[i], data[i+1], data[i+2], data[i+3])) {
                    data[i+3] = 0; // Set alpha to 0
                    removedCount++;
                }
            }

            // Put data back and update currentImage
            ctx.putImageData(imgData, 0, 0);
            
            // Overwrite original/current so filters apply to the transparent version
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCanvas.getContext('2d').putImageData(imgData, 0, 0);
            
            originalImage = tempCanvas;
            resetState();
            applyTransformations(); // this resets currentImage and applies null filters
            
            showToast(`Removed approx ${Math.floor(removedCount/1000)}k pixels.`);
            
            // Turn off mode automatically
            isBgRemovalMode = false;
            btnRemoveBgMode.style.background = '';
            btnRemoveBgMode.style.color = '';
            btnRemoveBgMode.textContent = 'Enable Magic Eraser Mode';
            canvas.style.cursor = 'default';
        }

        // Download
        document.getElementById('btnDownload').addEventListener('click', () => {
            if(!currentImage) {
                showToast("No image to download");
                return;
            }
            
            const format = document.getElementById('exportFormat').value;
            const quality = parseFloat(document.getElementById('exportQuality').value);
            
            const dataUrl = canvas.toDataURL(format, quality);
            
            const ext = format.split('/')[1];
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `edited-image.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            showToast("Download started!");
        });

        document.getElementById('exportQuality').addEventListener('input', (e) => {
            document.getElementById('valQuality').textContent = e.target.value;
        });

    </script>
</body>
</html>
