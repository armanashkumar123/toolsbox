<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator - Beautify JSON Online | ToolsHub</title>
    <meta name="description" content="Free online JSON formatter, validator, and beautifier. Format, minify, and validate JSON data instantly with our secure, client-side tool.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a1a;
            --card-bg: rgba(18, 18, 42, 0.8);
            --primary: #6C63FF;
            --accent: #00D4AA;
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --danger: #ff4757;
            --success: #2ed573;
            --border: rgba(108, 99, 255, 0.2);
            --border-hover: rgba(108, 99, 255, 0.5);
            --font-main: 'Inter', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(108, 99, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 212, 170, 0.05), transparent 25%);
        }

        header {
            padding: 1.5rem 2rem;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .logo:hover {
            color: var(--primary);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(108, 99, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background: #5a52d6;
            border-color: #5a52d6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.3);
        }

        select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 6px;
            font-family: var(--font-main);
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
            min-height: 500px;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .panel:focus-within {
            border-color: var(--primary);
        }

        .panel-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .panel-actions {
            display: flex;
            gap: 0.5rem;
        }

        .panel-body {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        textarea, .output-area {
            flex: 1;
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-code);
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            overflow: auto;
        }

        .output-area {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .status-bar {
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
        }

        .status-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-message.error {
            color: var(--danger);
        }

        .status-message.success {
            color: var(--success);
        }

        /* Syntax Highlighting */
        .string { color: #a3be8c; }
        .number { color: #d08770; }
        .boolean { color: #b48ead; }
        .null { color: #bf616a; }
        .key { color: var(--accent); }

        /* Tree View */
        .tree-view {
            font-family: var(--font-code);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .tree-toggle {
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            display: inline-block;
            width: 14px;
            text-align: center;
            transition: transform 0.2s;
        }

        .tree-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .tree-node {
            margin-left: 1.5rem;
            display: block;
        }

        .tree-node.collapsed {
            display: none;
        }

        .tree-item {
            display: flex;
            align-items: flex-start;
        }
        
        .tree-key {
            color: var(--accent);
            margin-right: 0.25rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(108, 99, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(108, 99, 255, 0.5);
        }

        /* Error highlighting */
        .error-line {
            text-decoration: underline wavy var(--danger);
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html" class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            ToolsHub
        </a>
    </header>

    <main>
        <div>
            <h1>JSON Formatter & Validator</h1>
            <p style="color: var(--text-muted);">Format, validate, and explore your JSON data.</p>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" id="btn-format">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                Format
            </button>
            <select id="indent-select">
                <option value="2">2 Spaces</option>
                <option value="4">4 Spaces</option>
                <option value="tab">Tab</option>
            </select>
            <button class="btn" id="btn-minify">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6"></path><path d="M20 10h-6V4"></path><path d="M14 10l7-7"></path><path d="M3 21l7-7"></path></svg>
                Minify
            </button>
            <button class="btn" id="btn-validate">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Validate
            </button>
            <div style="flex: 1;"></div>
            <button class="btn" id="btn-sample">Load Sample</button>
            <button class="btn" id="btn-clear">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Clear
            </button>
        </div>

        <div class="workspace">
            <!-- Input Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Input</span>
                </div>
                <div class="panel-body">
                    <textarea id="json-input" placeholder="Paste your JSON here..." spellcheck="false"></textarea>
                </div>
                <div class="status-bar">
                    <span class="status-message" id="input-status">Ready</span>
                    <span id="input-stats">0 chars | 0 bytes</span>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Output</span>
                    <div class="panel-actions">
                        <button class="btn" id="btn-view-toggle" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                            Tree View
                        </button>
                        <button class="btn" id="btn-copy" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                            Copy
                        </button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="output-text" class="output-area"></div>
                    <div id="output-tree" class="output-area" style="display: none;"></div>
                </div>
                <div class="status-bar">
                    <span class="status-message" id="output-status"></span>
                    <span id="output-stats">0 chars | 0 bytes</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputElement = document.getElementById('json-input');
            const outputTextElement = document.getElementById('output-text');
            const outputTreeElement = document.getElementById('output-tree');
            const inputStatus = document.getElementById('input-status');
            const outputStatus = document.getElementById('output-status');
            const inputStats = document.getElementById('input-stats');
            const outputStats = document.getElementById('output-stats');
            const indentSelect = document.getElementById('indent-select');
            
            let currentView = 'text'; // 'text' or 'tree'
            let parsedData = null;
            let currentOutputString = '';

            // Update stats
            const updateStats = (text, element) => {
                const chars = text.length;
                const bytes = new Blob([text]).size;
                const formattedBytes = bytes > 1024 ? (bytes / 1024).toFixed(2) + ' KB' : bytes + ' bytes';
                element.textContent = `${chars} chars | ${formattedBytes}`;
            };

            inputElement.addEventListener('input', () => {
                updateStats(inputElement.value, inputStats);
                inputStatus.textContent = 'Ready';
                inputStatus.className = 'status-message';
                inputElement.classList.remove('error-line');
            });

            const setStatus = (element, message, type) => {
                element.textContent = message;
                element.className = `status-message ${type}`;
            };

            const getIndent = () => {
                const val = indentSelect.value;
                return val === 'tab' ? '\t' : parseInt(val, 10);
            };

            // Syntax highlighting
            const syntaxHighlight = (json) => {
                json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                    let cls = 'number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'key';
                        } else {
                            cls = 'string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'boolean';
                    } else if (/null/.test(match)) {
                        cls = 'null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
            };

            // Parse and Validate
            const processJSON = (input) => {
                if (!input.trim()) {
                    setStatus(inputStatus, 'Input is empty', 'error');
                    return false;
                }
                try {
                    parsedData = JSON.parse(input);
                    setStatus(inputStatus, 'Valid JSON ✓', 'success');
                    inputElement.classList.remove('error-line');
                    return true;
                } catch (e) {
                    parsedData = null;
                    const errorMatch = e.message.match(/at position (\d+)/);
                    if (errorMatch) {
                        const position = parseInt(errorMatch[1], 10);
                        const substring = input.substring(0, position);
                        const line = (substring.match(/\n/g) || []).length + 1;
                        setStatus(inputStatus, `Error at line ${line}: ${e.message}`, 'error');
                    } else {
                        setStatus(inputStatus, `Invalid JSON: ${e.message}`, 'error');
                    }
                    inputElement.classList.add('error-line');
                    return false;
                }
            };

            const updateOutput = (formattedStr) => {
                currentOutputString = formattedStr;
                outputTextElement.innerHTML = syntaxHighlight(formattedStr);
                updateStats(formattedStr, outputStats);
                if (currentView === 'tree') {
                    renderTree(parsedData, outputTreeElement);
                }
            };

            document.getElementById('btn-format').addEventListener('click', () => {
                const input = inputElement.value;
                if (processJSON(input)) {
                    updateOutput(JSON.stringify(parsedData, null, getIndent()));
                    setStatus(outputStatus, 'Formatted successfully', 'success');
                } else {
                    outputTextElement.innerHTML = '';
                    outputTreeElement.innerHTML = '';
                    setStatus(outputStatus, 'Cannot format invalid JSON', 'error');
                }
            });

            document.getElementById('btn-minify').addEventListener('click', () => {
                const input = inputElement.value;
                if (processJSON(input)) {
                    updateOutput(JSON.stringify(parsedData));
                    setStatus(outputStatus, 'Minified successfully', 'success');
                } else {
                    outputTextElement.innerHTML = '';
                    outputTreeElement.innerHTML = '';
                    setStatus(outputStatus, 'Cannot minify invalid JSON', 'error');
                }
            });

            document.getElementById('btn-validate').addEventListener('click', () => {
                const input = inputElement.value;
                if (processJSON(input)) {
                    setStatus(outputStatus, 'JSON is valid ✓', 'success');
                }
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                inputElement.value = '';
                outputTextElement.innerHTML = '';
                outputTreeElement.innerHTML = '';
                currentOutputString = '';
                parsedData = null;
                updateStats('', inputStats);
                updateStats('', outputStats);
                setStatus(inputStatus, 'Ready', '');
                setStatus(outputStatus, '', '');
                inputElement.classList.remove('error-line');
            });

            document.getElementById('btn-sample').addEventListener('click', () => {
                const sample = {
                    "name": "ToolsHub",
                    "version": "1.0.0",
                    "isAwesome": true,
                    "features": [
                        "Formatting",
                        "Validation",
                        "Minification"
                    ],
                    "metadata": {
                        "author": "Developer",
                        "tags": ["json", "tool", "web"],
                        "settings": null
                    }
                };
                inputElement.value = JSON.stringify(sample, null, 2);
                updateStats(inputElement.value, inputStats);
                inputStatus.textContent = 'Ready';
                inputStatus.className = 'status-message';
                document.getElementById('btn-format').click();
            });

            document.getElementById('btn-copy').addEventListener('click', () => {
                if (currentOutputString) {
                    navigator.clipboard.writeText(currentOutputString).then(() => {
                        const originalText = document.getElementById('btn-copy').innerText;
                        document.getElementById('btn-copy').innerText = 'Copied!';
                        setTimeout(() => {
                            document.getElementById('btn-copy').innerText = originalText;
                        }, 2000);
                    });
                }
            });

            // Tree View Logic
            const btnViewToggle = document.getElementById('btn-view-toggle');
            btnViewToggle.addEventListener('click', () => {
                if (currentView === 'text') {
                    currentView = 'tree';
                    outputTextElement.style.display = 'none';
                    outputTreeElement.style.display = 'block';
                    btnViewToggle.innerText = 'Text View';
                    if (parsedData !== null) {
                        renderTree(parsedData, outputTreeElement);
                    }
                } else {
                    currentView = 'text';
                    outputTextElement.style.display = 'block';
                    outputTreeElement.style.display = 'none';
                    btnViewToggle.innerText = 'Tree View';
                }
            });

            const createTreeNode = (key, value, isLast) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tree-item';
                
                const type = value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
                
                if (type === 'object' || type === 'array') {
                    const toggle = document.createElement('span');
                    toggle.className = 'tree-toggle';
                    toggle.innerText = '▼';
                    
                    const keySpan = document.createElement('span');
                    if (key !== null) {
                        keySpan.className = 'tree-key';
                        keySpan.innerText = `"${key}": `;
                    }
                    
                    const openBrace = document.createElement('span');
                    openBrace.innerText = type === 'array' ? '[' : '{';
                    
                    const childrenWrapper = document.createElement('div');
                    childrenWrapper.className = 'tree-node';
                    
                    toggle.onclick = () => {
                        toggle.classList.toggle('collapsed');
                        childrenWrapper.classList.toggle('collapsed');
                        toggle.innerText = toggle.classList.contains('collapsed') ? '▶' : '▼';
                    };
                    
                    const header = document.createElement('div');
                    header.appendChild(toggle);
                    if (key !== null) header.appendChild(keySpan);
                    header.appendChild(openBrace);
                    
                    wrapper.appendChild(header);
                    wrapper.appendChild(childrenWrapper);
                    
                    const keys = Object.keys(value);
                    keys.forEach((k, idx) => {
                        childrenWrapper.appendChild(createTreeNode(type === 'array' ? null : k, value[k], idx === keys.length - 1));
                    });
                    
                    const closeBrace = document.createElement('div');
                    closeBrace.innerText = (type === 'array' ? ']' : '}') + (isLast ? '' : ',');
                    wrapper.appendChild(closeBrace);
                    
                } else {
                    const toggleSpacer = document.createElement('span');
                    toggleSpacer.style.width = '14px';
                    toggleSpacer.style.display = 'inline-block';
                    
                    const keySpan = document.createElement('span');
                    if (key !== null) {
                        keySpan.className = 'tree-key';
                        keySpan.innerText = `"${key}": `;
                    }
                    
                    const valSpan = document.createElement('span');
                    valSpan.className = type;
                    valSpan.innerText = type === 'string' ? `"${value}"` : String(value);
                    
                    const comma = document.createElement('span');
                    comma.innerText = isLast ? '' : ',';
                    
                    wrapper.appendChild(toggleSpacer);
                    if (key !== null) wrapper.appendChild(keySpan);
                    wrapper.appendChild(valSpan);
                    wrapper.appendChild(comma);
                }
                
                return wrapper;
            };

            const renderTree = (data, container) => {
                container.innerHTML = '';
                if (data !== null) {
                    container.className = 'tree-view output-area';
                    container.appendChild(createTreeNode(null, data, true));
                }
            };
        });
    </script>
</body>
</html>
