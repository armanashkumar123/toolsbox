<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Detail — AcroVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0b; --surface: #131314; --surface-hover: #1c1c1e;
            --border: #27272a; --primary: #3e52ff; --primary-hover: #5a6eff;
            --text-main: #ffffff; --text-muted: #a1a1aa;
            --radius: 4px; --radius-lg: 8px;
            --font-display: 'Geist', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
        }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        
        nav { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(10,10,11,0.95); border-bottom: 1px solid var(--border); z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; backdrop-filter: blur(8px); }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); }
        .nav-brand svg { width: 20px; height: 20px; color: var(--primary); }
        .nav-brand-text { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
        .nav-links { display: flex; gap: 24px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-main); }
        .btn-upgrade { background: var(--primary); color: #fff !important; padding: 6px 16px; border-radius: var(--radius); font-weight: 500; }
        
        .container { max-width: 1280px; margin: 100px auto 80px; padding: 0 32px; display: grid; grid-template-columns: 300px 1fr; gap: 48px; }
        
        /* Sidebar Metadata */
        .sidebar { display: flex; flex-direction: column; gap: 24px; }
        .meta-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .meta-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .meta-value { font-size: 0.95rem; font-weight: 500; word-break: break-all; }
        .meta-value a { color: var(--primary); text-decoration: none; }
        .meta-value a:hover { text-decoration: underline; }
        
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: var(--bg); border: 1px solid var(--border); padding: 4px 8px; border-radius: 2px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }

        /* Main Content */
        .header { border-bottom: 1px solid var(--border); padding-bottom: 32px; margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-start; }
        .title-area h1 { font-family: var(--font-display); font-size: 2.5rem; letter-spacing: -0.02em; margin-bottom: 8px; }
        .category-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        
        .btn-launch { display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: var(--radius); font-weight: 500; font-family: var(--font-body); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); transition: background 0.2s; }
        .btn-launch:hover { background: var(--primary-hover); }

        .content { font-size: 1.05rem; color: #d4d4d8; line-height: 1.7; max-width: 800px; }
        .content h2 { font-family: var(--font-display); font-size: 1.5rem; color: var(--text-main); margin: 32px 0 16px; font-weight: 600; }
        .content p { margin-bottom: 16px; }

        footer { border-top: 1px solid var(--border); padding: 40px 32px; text-align: center; color: var(--text-muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 12px; grid-column: span 2; }
        .footer-links { display: flex; justify-content: center; gap: 24px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 24px; }
            footer { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">
            <i data-lucide="shield"></i>
            <span class="nav-brand-text">AcroVault</span>
        </a>
        <div class="nav-links">
            <a href="/">Directory</a>
            <a href="about.html">About</a>
            <a href="premium.html" class="btn-upgrade">Premium</a>
        </div>
    </nav>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="meta-card">
                <span class="meta-label">Access Type</span>
                <span class="meta-value">Free / Open Source</span>
            </div>
            <div class="meta-card">
                <span class="meta-label">Source URL</span>
                <span class="meta-value" id="toolUrlDisplay"><a href="#" target="_blank">Loading...</a></span>
            </div>
            <div class="meta-card">
                <span class="meta-label">Tags</span>
                <div class="tag-list" id="toolTags">
                    <span class="tag">INTEL</span>
                </div>
            </div>
        </aside>

        <main>
            <div class="header">
                <div class="title-area">
                    <div class="category-badge" id="toolCategory"><i data-lucide="box" style="width:14px;height:14px;"></i> <span>Loading...</span></div>
                    <h1 id="toolName">Loading...</h1>
                </div>
                <a href="#" id="toolUrlBtn" class="btn-launch" target="_blank" rel="noopener">
                    Launch Tool <i data-lucide="external-link" style="width:18px;height:18px;"></i>
                </a>
            </div>

            <div class="content" id="toolDesc">
                Loading intelligence data...
            </div>
        </main>
    </div>

    <script src="tools-data.js"></script>
    <script>
        const CAT_ICONS = {
            'crime-evidence': 'scale', 'osint': 'radar', 'roadmap': 'map',
            'hardware-hacking': 'cpu', 'ai-research': 'brain', 'vapt': 'shield-alert',
            'ai-hacking': 'bot', 'account-tools': 'user-plus', 'ai-attack': 'swords',
            'malware-analysis': 'bug', 'url-scanning': 'link-2', 'social-engineering': 'fish',
            'exploit-directory': 'bomb', 'malware-courses': 'graduation-cap',
            'digital-forensics': 'scan-search', 'port-scanners': 'network',
            'detection-tools': 'car', 'api-gateway': 'server', 'ethical-hacking': 'book-open',
            'breach-lookup': 'alert-triangle'
        };

        const urlParams = new URLSearchParams(window.location.search);
        const toolId = urlParams.get('id');
        const tools = window.ACROVAULT_TOOLS || [];
        
        const tool = tools.find(t => t.id === toolId);
        
        if (tool) {
            document.title = `${tool.name} — AcroVault`;
            document.getElementById('toolName').textContent = tool.name;
            
            const icon = CAT_ICONS[tool.category] || 'box';
            document.getElementById('toolCategory').innerHTML = `<i data-lucide="${icon}" style="width:14px;height:14px;"></i> <span>${tool.categoryName}</span>`;
            
            document.getElementById('toolUrlBtn').href = tool.url;
            
            const urlDisplay = document.getElementById('toolUrlDisplay');
            let shortUrl = tool.url;
            try { shortUrl = new URL(tool.url).hostname; } catch(e) {}
            urlDisplay.innerHTML = `<a href="${tool.url}" target="_blank" rel="noopener">${shortUrl}</a>`;
            
            // Build Description
            let descHtml = `<p>${tool.desc}</p>`;
            descHtml += `<h2>Overview</h2><p>This tool provides intelligence gathering and technical analysis capabilities tailored for ${tool.categoryName.toLowerCase()} workflows.</p>`;
            
            if (tool.nativePath) {
                document.getElementById('toolUrlBtn').href = tool.nativePath;
                document.getElementById('toolUrlBtn').innerHTML = `Run Native Tool <i data-lucide="play" style="width:18px;height:18px;"></i>`;
                descHtml += `<h2>Execution Environment</h2><p>This tool executes securely within the local browser sandbox. No data is transmitted to AcroVault servers during its operation.</p>`;
            }

            document.getElementById('toolDesc').innerHTML = descHtml;

            // Tags
            let tagsHtml = '';
            if (tool.tags && tool.tags.length > 0) {
                tagsHtml = tool.tags.map(t => `<span class="tag">${t.toUpperCase()}</span>`).join('');
            } else {
                tagsHtml = `<span class="tag">${tool.category.toUpperCase()}</span><span class="tag">INTEL</span>`;
            }
            document.getElementById('toolTags').innerHTML = tagsHtml;
            
        } else {
            document.getElementById('toolName').textContent = "Tool Not Found";
            document.getElementById('toolDesc').innerHTML = "<p>The requested intelligence module could not be located in the vault.</p>";
            document.getElementById('toolUrlBtn').style.display = 'none';
        }

        lucide.createIcons();
    </script>
</body>
</html>
