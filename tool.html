<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Details — AcroVault</title>
    <meta name="description" content="AcroVault cybersecurity tool details, links, and information.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0c0c10; --surface: rgba(20, 20, 28, 0.6); --surface-solid: #14141c;
            --primary: #00f0ff; --primary-dim: rgba(0, 240, 255, 0.12); --primary-glow: rgba(0, 240, 255, 0.25);
            --secondary: #a855f7; --secondary-dim: rgba(168, 85, 247, 0.12);
            --accent: #00ff94; --accent-dim: rgba(0, 255, 148, 0.12);
            --text: #eeeef0; --text-secondary: #8b8b9e;
            --border: rgba(255, 255, 255, 0.08); --border-hover: rgba(0, 240, 255, 0.3);
            --glass: blur(20px); --radius: 16px; --radius-sm: 10px;
            --font-display: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif;
        }
        html { scroll-behavior: smooth; }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }
        .bg-ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse at 15% 20%, rgba(0, 240, 255, 0.06) 0%, transparent 50%),
            radial-gradient(ellipse at 85% 70%, rgba(168, 85, 247, 0.06) 0%, transparent 50%); }
        .bg-dots { position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 28px 28px; }
        .content { position: relative; z-index: 1; }

        nav { position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 64px); max-width: 1320px; z-index: 100;
            padding: 0 28px; height: 64px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(12, 12, 16, 0.7); backdrop-filter: var(--glass);
            border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 16px 48px rgba(0,0,0,0.4); }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
        .nav-brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 16px var(--primary-dim); }
        .nav-brand-icon i { color: #000; width: 20px; height: 20px; }
        .nav-brand-text { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .nav-links a:hover { color: var(--primary); }

        .tool-page { max-width: 800px; margin: 0 auto; padding: 140px 32px 100px; }

        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; font-size: 0.85rem; }
        .breadcrumb a { color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb .sep { color: var(--text-secondary); }
        .breadcrumb .current { color: var(--primary); font-weight: 500; }

        .tool-hero {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 40px; backdrop-filter: var(--glass);
            margin-bottom: 32px; position: relative; overflow: hidden;
        }
        .tool-hero::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }
        .tool-hero-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
        .tool-big-icon {
            width: 72px; height: 72px; min-width: 72px; border-radius: var(--radius);
            background: linear-gradient(135deg, var(--primary-dim), var(--secondary-dim));
            border: 1px solid rgba(0, 240, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
        }
        .tool-big-icon i { color: var(--primary); width: 32px; height: 32px; }
        .tool-hero-info { flex: 1; }
        .tool-hero-info h1 {
            font-family: var(--font-display); font-size: 2rem; font-weight: 700;
            margin-bottom: 6px; letter-spacing: -0.02em;
        }
        .tool-hero-info .cat-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 14px; border-radius: 100px; font-size: 0.78rem; font-weight: 600;
            background: var(--secondary-dim); border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--secondary);
        }
        .tool-hero-info .cat-badge i { width: 14px; height: 14px; }

        .tool-desc-text { font-size: 1.05rem; color: var(--text-secondary); line-height: 1.7; }

        .tool-meta-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 32px;
        }
        .meta-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .meta-card .label { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
        .meta-card .label i { width: 14px; height: 14px; color: var(--primary); }
        .meta-card .value { font-family: var(--font-display); font-size: 1rem; font-weight: 600; }

        .tags-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
        .tag-chip {
            padding: 6px 16px; border-radius: 100px; font-size: 0.8rem; font-weight: 500;
            background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary);
        }

        .action-buttons { display: flex; gap: 16px; flex-wrap: wrap; }
        .btn-launch {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-sm); color: #000;
            text-decoration: none; font-family: var(--font-display);
            font-weight: 700; font-size: 1rem;
            transition: all 0.3s; box-shadow: 0 0 24px var(--primary-dim);
        }
        .btn-launch:hover { box-shadow: 0 0 40px var(--primary-glow); transform: translateY(-2px); }
        .btn-launch i { width: 18px; height: 18px; }
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 16px 24px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text);
            text-decoration: none; font-weight: 600; font-size: 0.95rem;
            transition: all 0.3s;
        }
        .btn-back:hover { border-color: var(--primary); background: var(--primary-dim); }
        .btn-back i { width: 16px; height: 16px; }

        .related-section { margin-top: 64px; }
        .related-section h2 { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600;
            margin-bottom: 20px; color: var(--text-secondary); }
        .related-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
        }
        .related-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 20px;
            text-decoration: none; color: var(--text);
            display: flex; align-items: center; gap: 14px;
            transition: all 0.3s;
        }
        .related-card:hover { border-color: var(--primary); background: var(--primary-dim);
            transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .related-icon { width: 40px; height: 40px; min-width: 40px; border-radius: 10px;
            background: var(--primary-dim); display: flex; align-items: center; justify-content: center; }
        .related-icon i { color: var(--primary); width: 18px; height: 18px; }
        .related-info h3 { font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; }
        .related-info p { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }

        .not-found { text-align: center; padding: 140px 20px; }
        .not-found h1 { font-family: var(--font-display); font-size: 2rem; color: var(--primary); margin-bottom: 16px; }
        .not-found p { color: var(--text-secondary); margin-bottom: 32px; }

        footer { border-top: 1px solid var(--border); padding: 48px 32px;
            text-align: center; color: var(--text-secondary); font-size: 0.85rem; }
        footer a { color: var(--primary); text-decoration: none; font-weight: 500; }

        @media (max-width: 768px) {
            nav { width: calc(100% - 32px); padding: 0 16px; }
            .tool-page { padding: 120px 16px 60px; }
            .tool-hero { padding: 24px; }
            .tool-hero-top { flex-direction: column; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <div class="bg-dots"></div>
    <div class="content">
        <nav>
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon"><i data-lucide="shield-check"></i></div>
                <span class="nav-brand-text">AcroVault</span>
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="premium.html">Premium</a>
                <a href="about.html">About</a>
            </div>
        </nav>

        <div class="tool-page" id="toolPage"></div>

        <footer>
            <p>© 2026 AcroVault — Cybersecurity Intelligence Platform</p>
            <p style="margin-top:10px;"><a href="/">Home</a> · <a href="premium.html">Premium</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
        </footer>
    </div>

    <script src="tools-data.js"></script>
    <script>
        const CAT_ICONS = {
            'crime-evidence': 'scale', 'osint': 'radar', 'roadmap': 'map',
            'hardware-hacking': 'cpu', 'ai-research': 'brain', 'vapt': 'shield-alert',
            'ai-hacking': 'bot', 'account-tools': 'user-plus', 'ai-attack': 'swords',
            'malware-analysis': 'bug', 'url-scanning': 'link-2', 'social-engineering': 'fish',
            'exploit-directory': 'bomb', 'malware-courses': 'graduation-cap',
            'digital-forensics': 'scan-search', 'port-scanners': 'network',
            'detection-tools': 'car', 'api-gateway': 'server', 'ethical-hacking': 'book-open',
            'security-learning': 'gamepad-2', 'ai-vuln-scanner': 'eye',
            'pentest-reports': 'file-text', 'jailbreak-ai': 'unlock',
            'api-key-scanning': 'key', 'photo-forensics': 'camera',
            'person-osint': 'user-search', 'dark-web-search': 'globe',
            'red-team': 'target', 'geo-osint': 'map-pin',
            'ai-infra-attack': 'cloud-lightning', 'dark-web-osint': 'moon',
            'esp32-offensive': 'chip', 'image-video-osint': 'image',
            'breach-lookup': 'alert-triangle'
        };

        const tools = window.ACROVAULT_TOOLS || [];
        const params = new URLSearchParams(window.location.search);
        const toolId = params.get('id');
        const page = document.getElementById('toolPage');

        if (!toolId) { showNotFound(); }
        else {
            const tool = tools.find(t => t.id === toolId);
            if (!tool) { showNotFound(); }
            else { renderTool(tool); }
        }

        function showNotFound() {
            page.innerHTML = `<div class="not-found"><h1>Tool Not Found</h1><p>The requested tool could not be located.</p>
                <a href="/" class="btn-back"><i data-lucide="arrow-left"></i> Back to Home</a></div>`;
            lucide.createIcons();
        }

        function renderTool(t) {
            const icon = CAT_ICONS[t.category] || 'external-link';
            const domain = t.url.replace(/https?:\/\//, '').split('/')[0];
            const related = tools.filter(r => r.category === t.category && r.id !== t.id).slice(0, 4);

            document.title = `${t.name} — AcroVault`;

            page.innerHTML = `
                <div class="breadcrumb">
                    <a href="/"><i data-lucide="home" style="width:14px;height:14px"></i></a>
                    <span class="sep">›</span>
                    <a href="/?cat=${t.category}">${t.categoryName}</a>
                    <span class="sep">›</span>
                    <span class="current">${t.name}</span>
                </div>

                <div class="tool-hero">
                    <div class="tool-hero-top">
                        <div class="tool-big-icon"><i data-lucide="${icon}"></i></div>
                        <div class="tool-hero-info">
                            <h1>${t.name}</h1>
                            <span class="cat-badge"><i data-lucide="${icon}"></i> ${t.categoryName}</span>
                        </div>
                    </div>
                    <p class="tool-desc-text">${t.desc}</p>
                </div>

                <div class="tool-meta-grid">
                    <div class="meta-card">
                        <div class="label"><i data-lucide="globe"></i> Website</div>
                        <div class="value">${domain}</div>
                    </div>
                    <div class="meta-card">
                        <div class="label"><i data-lucide="folder"></i> Category</div>
                        <div class="value">${t.categoryName}</div>
                    </div>
                    <div class="meta-card">
                        <div class="label"><i data-lucide="${t.isPremium ? 'lock' : 'unlock'}"></i> Access</div>
                        <div class="value">${t.isPremium ? '🔒 Premium' : '✅ Free'}</div>
                    </div>
                </div>

                ${t.tags && t.tags.length ? `<div class="tags-wrap">${t.tags.map(tg => `<span class="tag-chip">${tg}</span>`).join('')}</div>` : ''}

                <div class="action-buttons">
                    <a href="${t.url}" target="_blank" rel="noopener" class="btn-launch"><i data-lucide="external-link"></i> Launch Tool</a>
                    <a href="/" class="btn-back"><i data-lucide="arrow-left"></i> Back to All Tools</a>
                </div>

                ${related.length ? `
                <div class="related-section">
                    <h2>Related Tools in ${t.categoryName}</h2>
                    <div class="related-grid">
                        ${related.map(r => `
                            <a href="tool.html?id=${r.id}" class="related-card">
                                <div class="related-icon"><i data-lucide="${CAT_ICONS[r.category] || 'external-link'}"></i></div>
                                <div class="related-info">
                                    <h3>${r.name}</h3>
                                    <p>${r.desc.substring(0, 60)}${r.desc.length > 60 ? '...' : ''}</p>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>` : ''}
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
