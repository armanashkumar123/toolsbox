<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Detail — AcroVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-color: #0d0e15; --surface: #15161f; --surface-hover: #1e202d;
            --border: #262836; --border-active: #00f0ff;
            --text-main: #f0f0f5; --text-muted: #8b8d98;
            --cyan: #00f0ff; --purple: #b05bff;
            --radius-pill: 100px; --radius-card: 16px;
            --font-main: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font-main); background-color: var(--bg-color);
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px; background-position: center center;
            color: var(--text-main); min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased;
        }

        /* Nav */
        .nav-wrapper { position: fixed; top: 24px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; padding: 0 16px; }
        nav { display: flex; align-items: center; justify-content: space-between; background: rgba(21, 22, 31, 0.7); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 10px 24px; width: 100%; max-width: 1100px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); }
        .nav-brand-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: linear-gradient(135deg, var(--cyan), var(--purple)); border-radius: 10px; color: #fff; }
        .nav-brand-icon svg { width: 18px; height: 18px; fill: currentColor; }
        .nav-brand-text { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
        
        .nav-links { display: flex; align-items: center; gap: 28px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-main); }
        
        .btn-premium { background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 240, 255, 0.3); padding: 8px 20px; border-radius: var(--radius-pill); color: var(--cyan) !important; text-decoration: none; font-size: 0.9rem; font-weight: 600; box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-premium::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, transparent, transparent, var(--cyan)); animation: rotate 4s linear infinite; opacity: 0.3; z-index: -1; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .btn-premium:hover { background: rgba(0, 240, 255, 0.1); border-color: var(--cyan); box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); transform: translateY(-1px); }

        
        .container { max-width: 1100px; margin: 140px auto 80px; padding: 0 24px; display: grid; grid-template-columns: 1fr 340px; gap: 40px; }
        
        /* Main Content */
        .header { margin-bottom: 40px; }
        .title-area h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 16px; text-shadow: 0 0 40px rgba(0, 240, 255, 0.2); }
        .gradient-text { background: linear-gradient(to right, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .category-badge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--cyan); text-transform: uppercase; background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.2); padding: 6px 14px; border-radius: var(--radius-pill); margin-bottom: 24px; box-shadow: 0 0 15px rgba(0,240,255,0.1); }
        
        .content { font-size: 1.15rem; color: var(--text-main); line-height: 1.8; }
        .content h2 { font-size: 1.6rem; font-weight: 700; color: #fff; margin: 48px 0 24px; letter-spacing: -0.02em; }
        .content p { margin-bottom: 24px; color: var(--text-muted); }

        /* Sidebar Metadata */
        .sidebar { display: flex; flex-direction: column; gap: 24px; }
        .meta-card { background: rgba(21, 22, 31, 0.4); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 24px; }
        .meta-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; display: block; letter-spacing: 0.05em; }
        .meta-value { font-size: 1.05rem; font-weight: 500; word-break: break-all; }
        .meta-value a { color: var(--cyan); text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .meta-value a:hover { text-shadow: 0 0 15px rgba(0,240,255,0.5); }
        
        .btn-launch { position: relative; overflow: hidden; display: inline-flex; justify-content: center; align-items: center; gap: 12px; width: 100%; padding: 18px; border-radius: var(--radius-card); font-weight: 700; font-size: 1.1rem; background: linear-gradient(90deg, var(--cyan), var(--purple)); color: #fff; text-decoration: none; box-shadow: 0 12px 32px rgba(0, 240, 255, 0.25); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.2); }
        .btn-launch:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0, 240, 255, 0.4); border-color: rgba(255,255,255,0.4); }
        .btn-launch::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent); transform: skewX(-20deg); animation: shine 3s infinite; }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        footer { border-top: 1px solid var(--border); padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 16px; background: rgba(13, 14, 21, 0.9); grid-column: 1 / -1; }
        .footer-links { display: flex; justify-content: center; gap: 32px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; font-weight: 500; }
        .footer-links a:hover { color: var(--text-main); }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .nav-wrapper { top: 12px; padding: 0 12px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <div class="nav-wrapper">
        <nav>
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
                <span class="nav-brand-text">AcroVault</span>
            </a>
            <div class="nav-links">
                <a href="/">Directory</a>
                <a href="about.html">About</a>
                <a href="privacy.html">Privacy</a>
                <a href="premium.html" class="btn-premium">Premium</a>
            </div>
        </nav>
    </div>

    <div class="container">
        <main>
            <div class="header">
                <div class="category-badge" id="toolCategory"><i data-lucide="box" style="width:14px;height:14px;"></i> <span>Loading...</span></div>
                <h1 id="toolName" class="gradient-text">Loading...</h1>
            </div>
            <div class="content" id="toolDesc">
                Loading intelligence data...
            </div>
        </main>

        <aside class="sidebar" id="sidebar">
            <a href="#" id="toolUrlBtn" class="btn-launch" target="_blank" rel="noopener">
                Launch Platform <i data-lucide="external-link" style="width:18px;height:18px;"></i>
            </a>
            <div class="meta-card">
                <span class="meta-label">Access Type</span>
                <span class="meta-value" style="color: var(--cyan); display: flex; align-items: center; gap: 6px;"><i data-lucide="unlock" style="width:16px;height:16px;"></i> Free / Open Source</span>
            </div>
            <div class="meta-card">
                <span class="meta-label">Source URL</span>
                <span class="meta-value" id="toolUrlDisplay"><a href="#" target="_blank">Loading...</a></span>
            </div>
            <div class="meta-card">
                <span class="meta-label">Tags</span>
                <div class="tag-list" id="toolTags">
                    <span class="tag">INTEL</span>
                </div>
            </div>
        </aside>
    </div>

    <footer>
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="premium.html">Premium</a>
            <a href="about.html">About</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </div>
        <p>© 2026 AcroVault. Built for security professionals.</p>
    </footer>

    <script src="tools-data.js"></script>
    <script>
        const CAT_ICONS = {
            'crime-evidence': 'scale', 'osint': 'radar', 'roadmap': 'map',
            'hardware-hacking': 'cpu', 'ai-research': 'brain', 'vapt': 'shield-alert',
            'ai-hacking': 'bot', 'account-tools': 'user-plus', 'ai-attack': 'swords',
            'malware-analysis': 'bug', 'url-scanning': 'link-2', 'social-engineering': 'fish',
            'exploit-directory': 'bomb', 'malware-courses': 'graduation-cap',
            'digital-forensics': 'scan-search', 'port-scanners': 'network',
            'detection-tools': 'car', 'api-gateway': 'server', 'ethical-hacking': 'book-open',
            'breach-lookup': 'alert-triangle'
        };

        const urlParams = new URLSearchParams(window.location.search);
        const toolId = urlParams.get('id');
        const tools = window.ACROVAULT_TOOLS || [];
        
        const tool = tools.find(t => t.id === toolId);
        
        if (tool) {
            document.title = `${tool.name || 'Unnamed Tool'} — AcroVault`;
            document.getElementById('toolName').textContent = tool.name || 'Unnamed Tool';
            
            const icon = CAT_ICONS[tool.category] || 'box';
            document.getElementById('toolCategory').innerHTML = `<i data-lucide="${icon}" style="width:14px;height:14px;"></i> <span>${tool.categoryName}</span>`;
            
            document.getElementById('toolUrlBtn').href = tool.url;
            
            const urlDisplay = document.getElementById('toolUrlDisplay');
            let shortUrl = tool.url;
            try { shortUrl = new URL(tool.url).hostname.replace('www.',''); } catch(e) {}
            urlDisplay.innerHTML = `<a href="${tool.url}" target="_blank" rel="noopener"><i data-lucide="link" style="width:14px;height:14px;"></i> ${shortUrl}</a>`;
            
            let descHtml = `<p style="font-size: 1.25rem; color: #fff; margin-bottom: 40px; font-weight: 500;">${tool.desc || ''}</p>`;
            descHtml += `<h2>Overview</h2><p>This module provides advanced intelligence gathering and technical analysis capabilities tailored for ${tool.categoryName.toLowerCase()} operations. Integrates with existing SOC workflows and analyst playbooks.</p>`;
            
            if (tool.nativePath) {
                document.getElementById('toolUrlBtn').href = tool.nativePath;
                document.getElementById('toolUrlBtn').innerHTML = `Execute Locally <i data-lucide="play-circle" style="width:18px;height:18px;"></i>`;
                descHtml += `<h2>Execution Environment</h2><p><strong>Strict Local Sandboxing:</strong> This tool executes securely within the local browser sandbox. No telemetry, payload data, or queries are transmitted to AcroVault servers during its operation. Zero server-side footprint.</p>`;
            }

            document.getElementById('toolDesc').innerHTML = descHtml;

            let tagsHtml = '';
            if (tool.tags && tool.tags.length > 0) {
                tagsHtml = tool.tags.map(t => `<span class="tag">${t}</span>`).join('');
            } else {
                tagsHtml = `<span class="tag">${tool.category}</span><span class="tag">INTEL</span>`;
            }
            document.getElementById('toolTags').innerHTML = tagsHtml;
            
        } else {
            document.getElementById('toolName').textContent = "404 Not Found";
            document.getElementById('toolDesc').innerHTML = "<p>The requested intelligence module could not be located in the vault. Please verify the transmission ID.</p>";
            document.getElementById('toolUrlBtn').style.display = 'none';
        }

        lucide.createIcons();
    </script>
</body>
</html>
