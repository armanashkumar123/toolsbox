<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ToolsHub</title>
    <meta name="description" content="Contact ToolsHub for questions, feedback, or suggestions.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0a1a;color:#e8e8f0;line-height:1.8}
        .wrap{max-width:700px;margin:0 auto;padding:100px 2rem 60px}
        nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 2rem;height:70px;display:flex;align-items:center;background:rgba(10,10,26,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(108,99,255,0.15)}
        nav a{color:#e8e8f0;text-decoration:none;display:flex;align-items:center;gap:10px}
        .logo{width:36px;height:36px;background:linear-gradient(135deg,#6C63FF,#00D4AA);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
        .brand{font-weight:700;font-size:1.25rem}
        h1{font-size:2rem;margin-bottom:24px;background:linear-gradient(135deg,#6C63FF,#00D4AA);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        p{color:#8888aa;margin-bottom:16px}
        a{color:#6C63FF}
        .contact-card{background:rgba(18,18,42,0.8);border:1px solid rgba(108,99,255,0.15);border-radius:16px;padding:32px;backdrop-filter:blur(20px);margin:24px 0}
        .contact-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(108,99,255,0.1)}
        .contact-item:last-child{border:none}
        .contact-icon{font-size:1.5rem}
        footer{text-align:center;padding:40px 2rem;border-top:1px solid rgba(108,99,255,0.15);color:#8888aa;font-size:.85rem;margin-top:40px}
    </style>
</head>
<body>
    <nav><a href="index.html"><div class="logo">T</div><span class="brand">ToolsHub</span></a></nav>
    <div class="wrap">
        <h1>Contact Us</h1>
        <p>Have questions, feedback, or suggestions? We'd love to hear from you.</p>

        <div class="contact-card">
            <div class="contact-item">
                <span class="contact-icon">📧</span>
                <div>
                    <strong>Email</strong><br>
                    <a href="mailto:contact@toolshub.us.kg">contact@toolshub.us.kg</a>
                </div>
            </div>
            <div class="contact-item">
                <span class="contact-icon">🐙</span>
                <div>
                    <strong>GitHub</strong><br>
                    <a href="https://github.com">View on GitHub</a>
                </div>
            </div>
        </div>

        <p>We typically respond within 24-48 hours.</p>
        <p><a href="index.html">← Back to Tools</a></p>
    </div>
    <footer><p>© 2026 ToolsHub</p></footer>
</body>
</html>
